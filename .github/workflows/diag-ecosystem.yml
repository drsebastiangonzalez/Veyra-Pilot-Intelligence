name: Apply ecosystem visual fix

on:
  push:
    branches: [fix/ecosystem-svg-local-logos]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Apply ecosystem fix
        run: python scripts/apply-ecosystem-fix.py
      - name: Commit fix and clean temporary files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diag-ecosystem.yml scripts/apply-ecosystem-fix.py
          git add index.html assets/tech
          git commit -m "Fix ecosystem network and technology logos"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
