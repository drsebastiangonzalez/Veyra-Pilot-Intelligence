name: Patch Veyra Operation Showcase

on:
  push:
    branches:
      - feature/veyra-en-operacion
    paths:
      - assets/js/veyra-en-operacion.js
      - assets/veyra-en-operacion.html
      - tools/patch-veyra-operacion.py
      - .github/workflows/patch-veyra-operacion.yml

permissions:
  contents: write

jobs:
  patch-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/veyra-en-operacion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch home
        run: python tools/patch-veyra-operacion.py
      - name: Remove one-time patch helpers
        run: rm tools/patch-veyra-operacion.py .github/workflows/patch-veyra-operacion.yml
      - name: Commit patched home
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/veyra-en-operacion.js assets/veyra-en-operacion.html tools/patch-veyra-operacion.py .github/workflows/patch-veyra-operacion.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Veyra en operación to home"
          git push origin HEAD:feature/veyra-en-operacion
