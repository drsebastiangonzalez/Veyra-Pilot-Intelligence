name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site
      - name: Copy Pages build to writable staging
        run: |
          rm -rf ./_site_publish
          mkdir -p ./_site_publish
          cp -a ./_site/. ./_site_publish/
      - name: Assemble static A320 Foundations v1.0 manual
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          root = Path('_site_publish/modules/a320-intro/review-bb7715104404796ad908')
          data_dir = root / 'manual-data'
          parts = [
              ('c1.txt', 10000),
              ('c1b.txt', 10000),
              ('c1c.txt', 10000),
              ('c02.txt', 10000),
              ('c02b.txt', 10000),
              ('c03.txt', 20000),
              ('c04.txt', 20000),
              ('c05.txt', 20000),
              ('c06.txt', 20000),
              ('c07.txt', 20000),
              ('c08.txt', 14428),
          ]
          expected_b64_length = 164428
          expected_candidate_sha256 = '60363a4aeb789f6123b180791a02b08d1257674ca0faa8975ed53282a036bc5c'
          expected_final_sha256 = '12dd8012f636523f8acf4bc04f5e63f44f38bf1ad17829e301dc6e846f0668f9'

          chunks = []
          for filename, take in parts:
              text = (data_dir / filename).read_text(encoding='utf-8').strip()
              if len(text) < take:
                  raise RuntimeError(f'{filename} is incomplete: {len(text)} < {take}')
              chunks.append(text[:take])

          payload = ''.join(chunks)
          if len(payload) != expected_b64_length:
              raise RuntimeError(
                  f'Unexpected A320 manual payload length: {len(payload)} != {expected_b64_length}'
              )

          compressed = base64.b64decode(payload, validate=True)
          candidate_bytes = gzip.decompress(compressed)
          candidate_digest = hashlib.sha256(candidate_bytes).hexdigest()
          if candidate_digest != expected_candidate_sha256:
              raise RuntimeError(
                  f'A320 candidate manual SHA-256 mismatch: {candidate_digest} != {expected_candidate_sha256}'
              )

          html = candidate_bytes.decode('utf-8')
          if 'A320 Foundations Manual v1.0 Review' not in html:
              raise RuntimeError('A320 candidate manual title validation failed')

          replacements = [
              ('<title>Veyra · A320 Foundations Manual v1.0 Review</title>',
               '<title>Veyra · A320 Foundations Study Manual v1.0</title>'),
              ('<span>Manual de Estudio · Candidate Review</span>',
               '<span>Manual de Estudio · v1.0</span>'),
              ('<div class="reviewFlag">CANDIDATE FOR REVIEW · NOT YET PUBLIC NAVIGATION</div>',
               '<div class="reviewFlag">STUDY MANUAL v1.0 · FREE EDITION</div>'),
              ('<strong>Versión:</strong> 1.0 · Candidate for Review<br/>',
               '<strong>Versión:</strong> 1.0 · Final<br/>'),
              ('<strong>Revisión técnica y editorial:</strong> 15/09/2026<br/>',
               '<strong>Revisión técnica y editorial:</strong> 16/09/2026<br/>'),
          ]
          for old, new in replacements:
              if old not in html:
                  raise RuntimeError(f'A320 manual finalization marker not found: {old}')
              html = html.replace(old, new)

          final_bytes = html.encode('utf-8')
          final_digest = hashlib.sha256(final_bytes).hexdigest()
          if final_digest != expected_final_sha256:
              raise RuntimeError(
                  f'A320 final manual SHA-256 mismatch: {final_digest} != {expected_final_sha256}'
              )
          if 'A320 Foundations Study Manual v1.0' not in html or 'Candidate' in html or 'CANDIDATE' in html:
              raise RuntimeError('A320 final manual metadata validation failed')

          (root / 'manual.html').write_text(html, encoding='utf-8')

          # The visible Review Hub now lives in index-core.html; index.html is a
          # lightweight review-navigation wrapper. Finalize metadata in the core
          # document so the wrapper remains intact.
          hub_path = root / 'index-core.html'
          hub = hub_path.read_text(encoding='utf-8')
          hub_replacements = [
              ('Manual de Estudio A320 Foundations · v1.0 Candidate',
               'Manual de Estudio A320 Foundations · v1.0'),
              ('Versión corregida y alineada con Class 00–22. Ya está integrada en este entorno de revisión para validar contenido, estructura y referencias antes de fijarla como v1.0 definitiva.',
               'Versión final aprobada y alineada con Class 00–22, referencias cruzadas y anexos. Foundations queda cerrado como base gratuita estable.'),
              ('data-path="../class-00.html"', 'data-path="../class-00-v3.html"'),
              ('data-path="../class-01.html"', 'data-path="../class-01-v3.html"'),
              ('data-title="normal procedures"', 'data-title="normal procedures foundations"'),
              ('<div class="name">Normal Procedures</div>', '<div class="name">Normal Procedures Foundations</div>'),
              ('Siguiente paso editorial: revisar este Manual de Estudio y, cuando quede aprobado, definir su versión definitiva y después diseñar el acceso público/registro sin exponer esta ruta de revisión.',
               'A320 Foundations v1.0 queda cerrado como base gratuita estable. El siguiente paso es diseñar el acceso público/registro y, por separado, la arquitectura de A320 Procedures & Operations como capa avanzada.'),
          ]
          for old, new in hub_replacements:
              if old in hub:
                  hub = hub.replace(old, new)
              elif new not in hub:
                  raise RuntimeError(
                      f'A320 Review Hub marker is neither source nor finalized value: {old}'
                  )
          hub_path.write_text(hub, encoding='utf-8')

          print(
              f'Assembled A320 Foundations Study Manual v1.0: '
              f'{len(final_bytes)} bytes, SHA-256 {final_digest}'
          )
          PY
      - name: Package Pages artifact
        run: tar --dereference --hard-dereference --directory "./_site_publish" -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
