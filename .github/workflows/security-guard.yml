name: Security Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-security:
    name: Repository security guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reject tracked secrets and privileged credentials
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          problems = []

          secret_suffixes = {
              ".pem", ".key", ".p12", ".pfx", ".jks", ".keystore",
              ".mobileprovision", ".ppk"
          }
          secret_names = {
              "credentials.json", "secrets.json", "id_rsa", "id_ed25519",
              ".npmrc", ".pypirc", ".netrc", "service-account.json",
              "service_account.json", "google-credentials.json"
          }

          content_checks = [
              ("Supabase secret key", re.compile(r"\bsb_secret_[A-Za-z0-9_-]{16,}\b")),
              ("GitHub access token", re.compile(r"\b(?:gh[pousr]_[A-Za-z0-9]{20,255}|github_pat_[A-Za-z0-9_]{20,255})\b")),
              ("OpenAI secret key", re.compile(r"\bsk-(?:proj|svcacct)-[A-Za-z0-9_-]{20,}\b")),
              ("AWS access key", re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b")),
              ("Stripe live secret", re.compile(r"\bsk_live_[A-Za-z0-9]{16,}\b")),
              ("Private key block", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("Hard-coded privileged credential", re.compile(
                  r"\b(?:OPENAI_API_KEY|OPENAI_KEY|WHATSAPP_ACCESS_TOKEN|WHATSAPP_TOKEN|"
                  r"META_APP_SECRET|META_ACCESS_TOKEN|SUPABASE_SERVICE_ROLE_KEY|"
                  r"SUPABASE_SERVICE_ROLE|SERVICE_ROLE_KEY|AWS_SECRET_ACCESS_KEY|"
                  r"STRIPE_SECRET_KEY)\b\s*=\s*[\"'][^\"'$][^\"']+[\"']"
              )),
          ]

          text_suffixes = {
              ".html", ".htm", ".js", ".mjs", ".cjs", ".ts", ".tsx", ".jsx",
              ".json", ".yml", ".yaml", ".toml", ".ini", ".conf", ".txt", ".md",
              ".py", ".sh", ".sql"
          }

          for raw in tracked:
              path = pathlib.Path(raw)
              name = path.name.lower()

              if name == ".env" or (name.startswith(".env.") and name != ".env.example"):
                  problems.append((raw, "environment file tracked"))
              if path.suffix.lower() in secret_suffixes or name in secret_names:
                  problems.append((raw, "private credential/signing file tracked"))
              if name.startswith("service-account") and path.suffix.lower() == ".json":
                  problems.append((raw, "service-account file tracked"))
              if name.startswith("service_account") and path.suffix.lower() == ".json":
                  problems.append((raw, "service-account file tracked"))
              if name.startswith("firebase-adminsdk") and path.suffix.lower() == ".json":
                  problems.append((raw, "Firebase admin credential file tracked"))

              if path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  content = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue

              for label, pattern in content_checks:
                  if pattern.search(content):
                      problems.append((raw, label))

          if problems:
              print("Security Guard blocked this change. No secret values are printed.")
              for path, reason in sorted(set(problems)):
                  print(f"- {path}: {reason}")
              sys.exit(1)

          print("Security Guard passed: no tracked secret files or privileged hard-coded credentials detected.")
