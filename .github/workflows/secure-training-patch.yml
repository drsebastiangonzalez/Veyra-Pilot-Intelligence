name: Finalize secure training migration

on:
  push:
    branches: [security/secure-training-bank-v1]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Apply final secure training patch
        run: python scripts/finalize-secure-training.py
      - name: Syntax check adapters
        run: |
          node --check assets/js/secure-training-practice.js
          node --check assets/js/secure-presolo-exam.js
      - name: Verify sensitive banks removed from index
        run: |
          ! grep -q 'PPA-AER-001' index.html
          ! grep -q 'VEYRA2026' index.html
          grep -q '<script id="question-data" type="application/json">\[\]</script>' index.html
      - name: Commit final files and remove temporary migration artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ppa-supabase-test.html assets/js/secure-training-practice.js assets/js/secure-presolo-exam.js ppa-practice.html pca-practice.html
          git rm -rf tmp-presolo-bank scripts/secure-training-patch.py scripts/inspect-presolo-bank.py scripts/export-presolo-bank.py scripts/finalize-secure-training.py .github/workflows/secure-training-patch.yml
          git commit -m "Security: move assessment grading and question banks server-side"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
