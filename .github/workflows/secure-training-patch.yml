name: Inspect secure training migration

on:
  push:
    branches: [security/secure-training-bank-v1]

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect embedded Pre-Solo bank
        run: python scripts/inspect-presolo-bank.py
      - name: Syntax check secure adapter
        run: node --check assets/js/secure-training-practice.js
