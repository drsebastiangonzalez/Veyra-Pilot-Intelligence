name: Export secure training migration

on:
  push:
    branches: [security/secure-training-bank-v1]

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Export embedded Pre-Solo bank
        run: python scripts/export-presolo-bank.py
      - name: Syntax check secure adapter
        run: node --check assets/js/secure-training-practice.js
      - name: Commit temporary bank chunks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-presolo-bank
          if git diff --cached --quiet; then
            echo "No export changes to commit."
            exit 0
          fi
          git commit -m "Temporary: export Pre-Solo bank for secure migration"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
