name: Temporary CodeQL remediation

on:
  push:
    branches:
      - security/codeql-high-fixes
    paths:
      - .github/workflows/security-remediate-codeql.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/codeql-high-fixes
          fetch-depth: 0

      - name: Apply surgical remediations
        run: python .github/scripts/remediate_codeql.py

      - name: Validate diff
        run: |
          git diff --check
          test -s index.html
          test -s modules/ifr-hold-07/index.html

      - name: Commit remediation
        run: |
          if git diff --quiet; then
            echo "No remediation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html modules/ifr-hold-07/index.html
          git commit -m "Remediate high CodeQL DOM findings"
          git push origin HEAD:security/codeql-high-fixes
