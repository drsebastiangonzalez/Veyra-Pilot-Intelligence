name: Patch homepage audience architecture

on:
  push:
    branches: [commercial/homepage-audience-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Patch homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch-homepage-audience.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if 'homeAudiencePaths' not in s:", "if 'class=\"homeAudiencePaths\"' not in s:")
          p.write_text(s,encoding='utf-8')
          PY
          python scripts/patch-homepage-audience.py
      - name: Validate audience architecture
        run: |
          test -f evaluacion-evidencia.html
          grep -q 'class="homeAudiencePaths"' index.html
          grep -q 'Pilotos e instructores' index.html
          grep -q 'Organizaciones' index.html
          grep -q 'href="evaluacion-evidencia.html"' index.html
          grep -q 'class="homeCapabilitiesFoot"' index.html
          ! grep -q 'aria-label="Explorador de módulos Veyra"' index.html
      - name: Commit homepage changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git commit -m "Commercial: simplify homepage around audience paths"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
