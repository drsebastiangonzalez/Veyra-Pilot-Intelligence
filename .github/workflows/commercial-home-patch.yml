name: Patch commercial homepage

on:
  push:
    branches: [commercial/product-pages-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Patch homepage
        run: python scripts/patch-commercial-home.py
      - name: Validate commercial pages
        run: |
          test -f instructor-assistant.html
          test -f analytics.html
          test -f training-center.html
          test -f voa.html
          test -f assets/css/veyra-solutions.css
          grep -q 'href="instructor-assistant.html"' index.html
          grep -q 'href="analytics.html"' index.html
          grep -q 'href="training-center.html"' index.html
          grep -q 'href="voa.html"' index.html
      - name: Commit homepage changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes to commit."
            exit 0
          fi
          git commit -m "Commercial: link homepage capabilities to solution pages"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
