name: Patch public SEO metadata

on:
  push:
    branches: [seo/public-discovery-v1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Patch public SEO
        run: python scripts/patch-seo-public.py
      - name: Validate SEO surfaces
        run: |
          test -f sitemap.xml
          for f in index.html que-es-veyra.html instructor-assistant.html evaluacion-evidencia.html analytics.html training-center.html voa.html; do
            grep -q 'rel="canonical"' "$f"
            grep -q 'application/ld+json' "$f"
            grep -q 'property="og:title"' "$f"
            grep -q 'name="twitter:card"' "$f"
          done
          grep -q 'BreadcrumbList' instructor-assistant.html
          grep -q 'ItemList' index.html
      - name: Commit SEO changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html que-es-veyra.html instructor-assistant.html evaluacion-evidencia.html analytics.html training-center.html voa.html
          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
            exit 0
          fi
          git commit -m "SEO: strengthen Veyra product discovery metadata"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
