name: Import approved PPA v7 PDF (one time)

on:
  push:
    branches: [feat/ppa-guide-v7-publication]
    paths:
      - tools/ppa-transfer/**
      - .github/workflows/one-time-ppa-transfer.yml

permissions:
  contents: read

concurrency:
  group: ppa-v7-one-time-transfer
  cancel-in-progress: false

jobs:
  import-pdf:
    if: github.ref == 'refs/heads/feat/ppa-guide-v7-publication'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ppa-guide-v7-publication
      - name: Verify and restore exact approved PDF
        run: |
          set -euo pipefail
          test "$(git hash-object assets/guias/guia-rapida-chequeo-pca-cirrus-sr20-veyra.pdf)" = "72edae18d86600a2d09188c220ed5c5d0f213b60"
          python tools/ppa-transfer/import_pdf.py
          test "$(git hash-object assets/guias/guia-rapida-chequeo-ppa-veyra.pdf)" = "ad550b8509ca5c9e0e7fd574be71e917d37d70ba"
          test "$(git hash-object assets/guias/guia-rapida-chequeo-pca-cirrus-sr20-veyra.pdf)" = "72edae18d86600a2d09188c220ed5c5d0f213b60"
          git diff --check
      - name: Commit PDF and existing PPA button only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/guias/guia-rapida-chequeo-ppa-veyra.pdf index.html
          git diff --cached --stat
          git commit -m 'Publish exact user-approved PPA v7 PDF and update PPA button'
          git push origin HEAD:feat/ppa-guide-v7-publication
