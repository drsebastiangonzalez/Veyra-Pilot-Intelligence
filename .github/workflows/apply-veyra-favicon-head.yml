name: Apply Veyra favicon head

on:
  push:
    branches: [branding/favicon-web-icons-v1]

permissions:
  contents: write

jobs:
  apply-favicon-head:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Apply favicon metadata
        run: python scripts/apply-veyra-favicon-head.py
      - name: Commit favicon metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No favicon metadata changes to commit."
            exit 0
          fi
          git commit -m "Branding: connect Veyra favicon metadata"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
