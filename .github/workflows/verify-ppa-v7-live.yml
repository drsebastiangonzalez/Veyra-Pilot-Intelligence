name: Verify published PPA v7 (read only)
on:
  push:
    branches: [verify/ppa-v7-publication]
    paths: [.github/workflows/verify-ppa-v7-live.yml]
permissions:
  contents: read
jobs:
  public-http-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Fetch public PDF and Training Center; verify exact bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib, json, time
          from datetime import datetime, timezone
          target = '3ff6fe3eb028d264492a0ad7726295fa8a5116abbf57ab2272d1f0f95490a6f4'
          pdf_url = 'https://veyrapilot.com/assets/guias/guia-rapida-chequeo-ppa-veyra.pdf?v=7-3ff6fe3e'
          home_url = 'https://veyrapilot.com/?view=training&v=7-3ff6fe3e'
          pca_url = 'https://veyrapilot.com/assets/guias/guia-rapida-chequeo-pca-cirrus-sr20-veyra.pdf'
          out = Path('published-ppa-verification'); out.mkdir()
          def get(url):
              req = Request(url, headers={'User-Agent':'Veyra-Publication-Verification/1.0', 'Cache-Control':'no-cache'})
              with urlopen(req, timeout=20) as r:
                  data = r.read(4_000_001)
                  if r.status != 200 or len(data) > 4_000_000:
                      raise RuntimeError('Unexpected HTTP response')
                  return data, {'url':url, 'final_url':r.url, 'status':r.status, 'content_type':r.headers.get('Content-Type'), 'bytes':len(data)}
          for attempt in range(1, 16):
              try:
                  pdf, pdf_report = get(pdf_url)
                  digest = hashlib.sha256(pdf).hexdigest()
                  if digest != target or len(pdf) != 261196 or not pdf.startswith(b'%PDF-'):
                      raise RuntimeError('CDN does not yet serve the approved PDF: ' + digest)
                  if 'application/pdf' not in (pdf_report['content_type'] or ''):
                      raise RuntimeError('PDF is not served with the PDF content type')
                  home, home_report = get(home_url)
                  html = home.decode('utf-8')
                  marker = 'assets/guias/guia-rapida-chequeo-ppa-veyra.pdf?v=7-3ff6fe3e'
                  if html.count(marker) != 1 or 'Ver guía PPA · v7</button>' not in html or 'id="trainingModules"' not in html:
                      raise RuntimeError('Training Center does not yet serve the v7 button')
                  pca, pca_report = get(pca_url)
                  pca_blob = hashlib.sha1(b'blob ' + str(len(pca)).encode() + b'\0' + pca).hexdigest()
                  if pca_blob != '72edae18d86600a2d09188c220ed5c5d0f213b60':
                      raise RuntimeError('Unexpected change to public PCA PDF')
                  report = {'verified_at':datetime.now(timezone.utc).isoformat(), 'result':'success', 'pdf':dict(pdf_report, sha256=digest, approved_file_identical=True), 'training_center':dict(home_report, ppa_v7_button_found=True), 'pca':dict(pca_report, git_blob=pca_blob, unchanged=True)}
                  (out/'guia-ppa-v7-served.pdf').write_bytes(pdf)
                  (out/'training-center-served.html').write_bytes(home)
                  (out/'verification.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
                  print(json.dumps(report, indent=2))
                  break
              except Exception as exc:
                  print(f'Attempt {attempt}: {exc}', flush=True)
                  if attempt == 15:
                      raise
                  time.sleep(15)
          PY
      - name: Preserve independently downloaded public files and verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ppa-v7-live-verification
          path: published-ppa-verification/
          retention-days: 7
          if-no-files-found: error
