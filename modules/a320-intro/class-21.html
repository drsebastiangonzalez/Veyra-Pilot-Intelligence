<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07111f">
<title>Veyra | A320 Foundations · Clase 21 Limitations</title>
<style>html,body{margin:0;min-height:100%;background:#07111f;color:#f7f4ed;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;letter-spacing:.14em;color:#a8b5c6}</style>
</head>
<body>
<div class="loading">LOADING CLASE 21…</div>
<script>
(async()=>{
  const build=new URLSearchParams(location.search).get('v')||'a320-foundations-v1';
  const version=encodeURIComponent(build);
  const rewriteAssets=html=>html.replace(/((?:src|href)=["']assets\/[^"'?]+)(?:\?v=[^"']*)?(["'])/g,(m,p,q)=>p+'?v='+version+q);
  try{
    const r=await fetch('class-21-core.html?v='+version,{cache:'no-store'});
    if(!r.ok)throw new Error('core '+r.status);
    let h=await r.text();
    h=h.replaceAll('CLASS 21','CLASE 21').replaceAll('Class 21','Clase 21');
    h=rewriteAssets(h);
    h=h.replace('<span class="pill">PILOT INTELLIGENCE</span>','<a class="pill" href="class-22.html?v='+version+'">Clase 22 →</a><span class="pill">PILOT INTELLIGENCE</span>');
    h=h.replace('</body>','<script src="assets/class-21-tailstrike-fix.js?v='+version+'"><\/script><script src="assets/class-21-tailstrike-inline-aircraft.js?v='+version+'"><\/script></body>');
    document.open();document.write(h);document.close();
  }catch(e){
    console.error(e);document.body.innerHTML='<div class="loading">CLASE 21 COULD NOT LOAD</div>';
  }
})();
</script>
</body>
</html>
