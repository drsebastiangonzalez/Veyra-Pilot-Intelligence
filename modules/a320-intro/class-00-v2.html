0%;top:76%}.sl{left:22%;top:61%}.sr{left:78%;top:61%}@media(max-width:700px){.hs{font-size:7px;padding:6px 8px}.sl{left:18%}.sr{left:82%}}';d.head.append(st);const box=el(d,'div','realCockpit'),img=el(d,'img');img.src='assets/a320-cockpit.webp';img.alt='Cabina A320, vista frontal';box.append(img);const defs={overhead:['OVERHEAD PANEL','Sistemas eléctricos, hidráulicos, neumáticos, combustible, luces, APU y otros controles de sistemas.'],main:['GLARESHIELD + MAIN INSTRUMENT PANEL','FCU y EFIS en el glareshield; PFD, ND, ECAM e instrumentos principales al frente.'],pedestal:['PEDESTAL','Thrust levers, MCDU, radios, speedbrake, parking brake y controles ECAM.'],side:['SIDE CONSOLE','Sidestick, tiller y otros controles laterales.']};[['OVERHEAD','overhead','oh'],['PANEL PRINCIPAL','main','mp'],['PEDESTAL','pedestal','pd'],['SIDE L','side','sl'],['SIDE R','side','sr']].forEach(([lab,key,cl])=>{const b=el(d,'button','hs '+cl,lab);b.type='button';b.onclick=()=>{box.querySelectorAll('.hs').forEach(x=>x.classList.remove('active'));b.classList.add('active');const z=s.querySelector('#zoneInfo');if(z){z.replaceChildren();z.append(el(d,'strong','',defs[key][0]),d.createElement('br'),d.createTextNode(defs[key][1]))}};box.append(b)});old.replaceWith(box)}frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;d.querySelectorAll('.airbusMark,.heroAirbusMark,.airbus,.heroLogo').forEach(n=>n.remove());d.querySelectorAll('img[src*="airbus-logo"]').forEach(n=>n.remove());ids(d);cockpit(d)})})();</script></body></html>
