ción documental',anchor:'ata'}};function make(d,t,c,x){const n=d.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n}function setIds(d){[...d.querySelectorAll('main>section')].forEach(s=>{const t=(s.querySelector('.eyebrow')?.textContent||'').toUpperCase();if(t.includes('01 ·'))s.id='flybywire';if(t.includes('02 ·'))s.id='protections';if(t.includes('03 ·'))s.id='darkcockpit';if(t.includes('LEER UN PUSHBUTTON'))s.id='pushbutton';if(t.includes('04 ·'))s.id='goldenrules';if(t.includes('05 ·'))s.id='cockpit';if(t.includes('06 ·'))s.id='colors';if(t.includes('07 ·'))s.id='alerts';if(t.includes('08 ·'))s.id='ecam'})}function addAta(d){if(d.getElementById('ata'))return;const e=[...d.querySelectorAll('main>section')].find(s=>(s.querySelector('.eyebrow')?.textContent||'').toUpperCase().includes('LO ESENCIAL'));if(!e)return;const s=make(d,'section','section');s.id='ata';const w=make(d,'div','wrap'),h=make(d,'div','head'),l=make(d,'div'),p=make(d,'div','patterns');l.append(make(d,'div','eyebrow','10 · ATA COMO MAPA'),make(d,'h2','', 'ATA organiza la documentación.'));h.append(l,make(d,'p','lead','Los números ATA ayudan a clasificar y localizar información de sistemas. No definen la severidad de una alerta ni sustituyen la documentación aplicable.'));[['ATA 24','Electrical.'],['ATA 29','Hydraulic.'],['ATA 34','Navigation.'],['Idea clave','ATA es un mapa documental estandarizado.']].forEach(([a,b])=>{const c=make(d,'div','pattern');c.append(make(d,'b','',a),make(d,'p','',b));p.append(c)});w.append(h,p);s.append(w);e.parentNode.insertBefore(s,e)}function upgradeCockpit(d){const s=d.getElementById('cockpit');if(!s||s.dataset.real==='1')return;s.dataset.real='1';const lead=s.querySelector('.lead');if(lead)lead.textContent='Selecciona una zona de la cabina para identificar su función principal.';const old=s.querySelector('.cockpit');if(!old)return;const st=make(d,'style');st.textContent='.realCockpit{position:relative;border:1px solid var(--line);background:#02060a;overflow:hidden}.realCockpit img{display:block;width:100%;height:auto;object-fit:contain}.cockpitHotspot{position:absolute;transform:translate(-50%,-50%);border:1px solid rgba(215,177,90,.8);background:rgba(7,17,31,.9);color:#f0d38d;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:900;letter-spacing:.08em}.cockpitHotspot.active{background:#d7b15a;color:#07111f}.hsOverhead{left:50%;top:17%}.hsMain{left:50%;top:48%}.hsPedestal{left:50%;top:76%}.hsLeft{left:22%;top:61%}.hsRight{left:78%;top:61%}@media(max-width:700px){.cockpitHotspot{padding:6px 8px;font-size:7px}.hsLeft{left:18%}.hsRight{left:82%}}';d.head.append(st);const box=make(d,'div','realCockpit'),img=make(d,'img');img.src='assets/a320-cockpit.webp';img.alt='Cabina A320, vista frontal';box.append(img);const defs={overhead:['OVERHEAD PANEL','Sistemas eléctricos, hidráulicos, neumáticos, combustible, luces, APU y otros controles de sistemas.'],main:['GLARESHIELD + MAIN INSTRUMENT PANEL','FCU y EFIS en el glareshield; PFD, ND, ECAM e instrumentos principales al frente.'],pedestal:['PEDESTAL','Thrust levers, MCDU, radios, speedbrake, parking brake y controles ECAM.'],side:['SIDE CONSOLE','Sidestick, tiller y otros controles laterales.']};[['OVERHEAD','overhead','hsOverhead'],['PANEL PRINCIPAL','main','hsMain'],['PEDESTAL','pedestal','hsPedestal'],['SIDE L','side','hsLeft'],['SIDE R','side','hsRight']].forEach(([lab,key,cl])=>{const b=make(d,'button','cockpitHotspot '+cl,lab);b.type='button';b.onclick=()=>{box.querySelectorAll('.cockpitHotspot').forEach(x=>x.classList.remove('active'));b.classList.add('active');const i=s.querySelector('#zoneInfo');if(i){i.replaceChildren();i.append(make(d,'strong','',defs[key][0]),d.createElement('br'),d.createTextNode(defs[key][1]))}};box.append(b)});old.replaceWith(box)}function enhance(d){const r=d.querySelector('#result .review');if(!r)return;[...r.children].forEach(c=>{if(c.dataset.enhanced==='1')return;const b=c.querySelector('b');if(!b)return;const q=b.textContent.replace(/^[✓↻]\s*/,'').trim(),m=meta[q];if(!m)return;const ok=c.classList.contains('good'),why=c.querySelector('span')?.textContent||'',ans=selected[q]||'Sin respuesta registrada';c.dataset.enhanced='1';c.replaceChildren();c.append(make(d,'b','',(ok?'✓ ':'↻ ')+q));const cmp=make(d,'div','reviewCompare');[['Tu respuesta',ans],['Respuesta correcta',m.correct]].forEach(([lab,val])=>{const z=make(d,'div','reviewBox');z.append(make(d,'small','',lab),make(d,'strong','',val));cmp.append(z)});c.append(cmp,make(d,'span','why',why));if(!ok){const bt=make(d,'button','reviewAction','Repasar este concepto →');bt.type='button';bt.onclick=()=>d.getElementById(m.anchor)?.scrollIntoView({behavior:'smooth',block:'start'});c.append(bt)}})}frame.addEventListener('load',()=>{const d=frame.contentDocument;if(!d)return;const st=make(d,'style');st.textContent='.reviewCompare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.reviewBox{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);padding:10px}.reviewBox small{display:block;color:#8f9bad;text-transform:uppercase;letter-spacing:.12em;font-size:9px;font-weight:900;margin-bottom:4px}.reviewBox strong{font-size:13px}.why{display:block;margin-top:10px}.reviewAction{margin-top:11px;border:1px solid rgba(215,177,90,.45);background:transparent;color:#f0d38d;padding:9px 12px;font-weight:900;font-size:10px;letter-spacing:.08em;text-transform:uppercase}@media(max-width:620px){.reviewCompare{grid-template-columns:1fr}}';d.head.append(st);setIds(d);addAta(d);upgradeCockpit(d);d.querySelectorAll('.airbusMark,.heroAirbusMark,.airbus,.heroLogo').forEach(n=>n.remove());d.querySelectorAll('img[src*="airbus-logo"]').forEach(n=>n.remove());d.addEventListener('click',e=>{const o=e.target.closest('.qopt');if(o){const q=d.querySelector('#qtext')?.textContent.trim();if(q)selected[q]=String(o.textContent||'').replace(/^[A-Z]\s*[·.)-]\s*/,'').trim()}},true);const r=d.querySelector('#result');if(r){new Mutatio
