<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07111f">
<title>Veyra | A320 Foundations · Clase 0</title>
<style>html,body{margin:0;width:100%;height:100%;background:#07111f;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#07111f}</style>
</head>
<body>
<iframe id="classFrame" title="A320 Foundations · Clase 0" src="class-00.html?v=5"></iframe>
<script>
(()=>{
'use strict';
const frame=document.getElementById('classFrame');
const selected={};
const meta={
'En el A320, el sidestick representa principalmente:':{correct:'Una intención procesada por computadores',anchor:'flybywire'},
'¿Qué hace posible que el sistema pueda acotar determinadas respuestas?':{correct:'La arquitectura fly-by-wire',anchor:'protections'},
'Un overhead prácticamente oscuro normalmente indica:':{correct:'Configuración normal',anchor:'darkcockpit'},
'Un pulsador muestra OFF en blanco. ¿Qué significa?':{correct:'Función desactivada por la tripulación',anchor:'pushbutton'},
'¿Qué regla se relaciona directamente con comprender los modos de automatización?':{correct:'Understand the FMA at all times',anchor:'goldenrules'},
'¿Dónde buscarías principalmente un selector de un sistema?':{correct:'Overhead panel',anchor:'cockpit'},
'¿Dónde se encuentra el FCU?':{correct:'Glareshield',anchor:'cockpit'},
'¿Cuál es la diferencia principal entre rojo y ámbar?':{correct:'Rojo suele implicar mayor urgencia; ámbar conciencia y atención',anchor:'colors'},
'¿Qué combinación corresponde a una alerta de nivel 2?':{correct:'Master Caution + single chime',anchor:'alerts'},
'¿Cuál es la pantalla inferior del ECAM?':{correct:'SD',anchor:'ecam'},
'¿Cuál describe mejor la lógica básica ECAM?':{correct:'Detecta, alerta, presenta acciones y actualiza',anchor:'ecam'},
'La numeración ATA sirve principalmente para:':{correct:'Clasificar y localizar información documental',anchor:'ata'}
};
function make(doc,tag,cls,text){const n=doc.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function stripChoice(t){return String(t||'').replace(/^[A-Z]\s*[·.)-]\s*/,'').trim()}
function setIds(doc){[...doc.querySelectorAll('main>section')].forEach(sec=>{const t=(sec.querySelector('.eyebrow')?.textContent||'').toUpperCase();if(t.includes('01 ·'))sec.id='flybywire';if(t.includes('02 ·'))sec.id='protections';if(t.includes('03 ·'))sec.id='darkcockpit';if(t.includes('LEER UN PUSHBUTTON'))sec.id='pushbutton';if(t.includes('04 ·'))sec.id='goldenrules';if(t.includes('05 ·'))sec.id='cockpit';if(t.includes('06 ·'))sec.id='colors';if(t.includes('07 ·'))sec.id='alerts';if(t.includes('08 ·'))sec.id='ecam'})}
function addAta(doc){if(doc.getElementById('ata'))return;const essential=[...doc.querySelectorAll('main>section')].find(s=>(s.querySelector('.eyebrow')?.textContent||'').toUpperCase().includes('LO ESENCIAL'));if(!essential)return;const s=make(doc,'section','section');s.id='ata';const w=make(doc,'div','wrap'),h=make(doc,'div','head'),l=make(doc,'div');l.append(make(doc,'div','eyebrow','10 · ATA COMO MAPA'),make(doc,'h2','', 'ATA organiza la documentación.'));h.append(l,make(doc,'p','lead','Los números ATA ayudan a clasificar y localizar información de sistemas. No definen la severidad de una alerta ni sustituyen la documentación aplicable.'));const p=make(doc,'div','patterns');[['ATA 24','Electrical.'],['ATA 29','Hydraulic.'],['ATA 34','Navigation.'],['Idea clave','ATA es un mapa documental estandarizado.']].forEach(([a,b])=>{const c=make(doc,'div','pattern');c.append(make(doc,'b','',a),make(doc,'p','',b));p.append(c)});w.append(h,p);s.append(w);essential.parentNode.insertBefore(s,essential)}
function upgradeCockpit(doc){const sec=doc.getElementById('cockpit');if(!sec||sec.dataset.real==='1')return;sec.dataset.real='1';const lead=sec.querySelector('.lead');if(lead)lead.textContent='Selecciona una zona de la cabina para identificar su función principal.';const old=sec.querySelector('.cockpit');if(!old)return;const style=make(doc,'style');style.textContent=`.realCockpit{position:relative;border:1px solid var(--line);background:#02060a;overflow:hidden;min-height:420px}.realCockpit img{display:block;width:100%;height:auto;object-fit:contain}.cockpitHotspot{position:absolute;transform:translate(-50%,-50%);border:1px solid rgba(215,177,90,.75);background:rgba(7,17,31,.88);color:#f0d38d;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:900;letter-spacing:.08em;box-shadow:0 5px 20px rgba(0,0,0,.3)}.cockpitHotspot:hover,.cockpitHotspot.active{background:#d7b15a;color:#07111f}.hsOverhead{left:50%;top:17%}.hsMain{left:50%;top:48%}.hsPedestal{left:50%;top:76%}.hsLeft{left:22%;top:61%}.hsRight{left:78%;top:61%}@media(max-width:700px){.realCockpit{min-height:0}.cockpitHotspot{padding:7px 9px;font-size:8px}.hsOverhead{top:18%}.hsMain{top:48%}.hsPedestal{top:75%}.hsLeft{left:19%;top:60%}.hsRight{left:81%;top:60%}}`;doc.head.appendChild(style);const box=make(doc,'div','realCockpit');const img=make(doc,'img');img.src='assets/a320-cockpit.webp';img.alt='Cabina A320, vista frontal';box.appendChild(img);const defs={overhead:['OVERHEAD','Sistemas eléctricos, hidráulicos, neumáticos, combustible, luces, APU y otros controles de sistemas.'],main:['GLARESHIELD + PANEL PRINCIPAL','FCU y EFIS en el glareshield; PFD, ND, ECAM e instrumentos principales al frente.'],pedestal:['PEDESTAL','Thrust levers, MCDU, radios, speedbrake, parking brake y controles ECAM.'],side:['SIDE CONSOLE','Sidestick, tiller y otros controles laterales.']};[['OVERHEAD','overhead','hsOverhead'],['PANEL PRINCIPAL','main','hsMain'],['PEDESTAL','pedestal','hsPedestal'],['SIDE L','side','hsLeft'],['SIDE R','side','hsRight']].forEach(([label,key,cls])=>{const b=make(doc,'button','cockpitHotspot '+cls,label);b.type='button';b.addEventListener('click',()=>{box.querySelectorAll('.cockpitHotspot').forEach(x=>x.classList.remove('active'));b.classList.add('active');const info=sec.querySelector('#zoneInfo');if(info){info.replaceChildren();info.append(make(doc,'strong','',defs[key][0]),doc.createElement('br'),doc.createTextNode(defs[key][1]))}});box.appendChild(b)});old.replaceWith(box)}
function reviewBox(doc,label,value){const b=make(doc,'div','reviewBox');b.append(make(doc,'small','',label),make(doc,'strong','',value));return b}
function enhance(doc){const review=doc.querySelector('#result .review');if(!review)return;[...review.children].forEach(card=>{if(card.dataset.enhanced==='1')return;const heading=card.querySelector('b');if(!heading)return;const q=heading.textContent.replace(/^[✓↻]\s*/,'').trim(),d=meta[q];if(!d)return;const ok=card.classList.contains('good'),why=card.querySelector('span')?.textContent||'',ans=selected[q]||'Sin respuesta registrada';card.dataset.enhanced='1';card.replaceChildren();card.append(make(doc,'b','',(ok?'✓ ':'↻ ')+q));const cmp=make(doc,'div','reviewCompare');cmp.append(reviewBox(doc,'Tu respuesta',ans),reviewBox(doc,'Respuesta correcta',d.correct));card.append(cmp,make(doc,'span','why',why));if(!ok){const bt=make(doc,'button','reviewAction','Repasar este concepto →');bt.type='button';bt.addEventListener('click',()=>doc.getElementById(d.anchor)?.scrollIntoView({behavior:'smooth',block:'start'}));card.append(bt)}})}
frame.addEventListener('load',()=>{const doc=frame.contentDocument;if(!doc)return;const st=make(doc,'style');st.textContent=`.reviewCompare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.reviewBox{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);padding:10px}.reviewBox small{display:block;color:#8f9bad;text-transform:uppercase;letter-spacing:.12em;font-size:9px;font-weight:900;margin-bottom:4px}.reviewBox strong{font-size:13px}.why{display:block;margin-top:10px}.reviewAction{margin-top:11px;border:1px solid rgba(215,177,90,.45);background:transparent;color:#f0d38d;padding:9px 12px;font-weight:900;font-size:10px;letter-spacing:.08em;text-transform:uppercase}@media(max-width:620px){.reviewCompare{grid-template-columns:1fr}}`;doc.head.appendChild(st);setIds(doc);addAta(doc);upgradeCockpit(doc);doc.querySelectorAll('.airbusMark,.heroAirbusMark,.airbus,.heroLogo').forEach(n=>n.remove());doc.querySelectorAll('img[src*="airbus-logo"]').forEach(n=>n.closest('div')?.remove());doc.addEventListener('click',e=>{const o=e.target.closest('.qopt');if(o){const q=doc.querySelector('#qtext')?.textContent.trim();if(q)selected[q]=stripChoice(o.textContent)}},true);const r=doc.querySelector('#result');if(r){new MutationObserver(()=>setTimeout(()=>enhance(doc),0)).observe(r,{childList:true,subtree:true});enhance(doc)}})})();
</script>
</body>
</html>
