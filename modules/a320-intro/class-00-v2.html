const selected={};
const meta={
'En el A320, el sidestick representa principalmente:':{correct:'Una intención procesada por computadores',anchor:'flybywire'},
'¿Qué hace posible que el sistema pueda acotar determinadas respuestas?':{correct:'La arquitectura fly-by-wire',anchor:'protections'},
'Un overhead prácticamente oscuro normalmente indica:':{correct:'Configuración normal',anchor:'darkcockpit'},
'Un pulsador muestra OFF en blanco. ¿Qué significa?':{correct:'Función desactivada por la tripulación',anchor:'pushbutton'},
'¿Qué regla se relaciona directamente con comprender los modos de automatización?':{correct:'Understand the FMA at all times',anchor:'goldenrules'},
'¿Dónde buscarías principalmente un selector de un sistema?':{correct:'Overhead panel',anchor:'cockpit'},
'¿Dónde se encuentra el FCU?':{correct:'Glareshield',anchor:'cockpit'},

'¿Qué combinación corresponde a una alerta de nivel 2?':{correct:'Master Caution + single chime',anchor:'alerts'},
'¿Cuál es la pantalla inferior del ECAM?':{correct:'SD',anchor:'ecam'},
'¿Cuál describe mejor la lógica básica ECAM?':{correct:'Detecta, alerta, presenta acciones y actualiza',anchor:'ecam'},
'La numeración ATA sirve principalmente para:':{correct:'Clasificar y localizar información documental',anchor:'ata'}
};
function stripChoice(t){return String(t||'').replace(/^[A-Z]\s*·\s*/,'').trim()}
function setIds(doc){
 const rows=[...doc.querySelectorAll('main>section')];
 rows.forEach(sec=>{const e=sec.querySelector('.eyebrow');const t=(e?.textContent||'').toUpperCase();
  if(t.includes('01 ·'))sec.id='flybywire';
  if(t.includes('02 ·'))sec.id='protections';
  if(t.includes('03 ·'))sec.id='darkcockpit';
  if(t.includes('LEER UN PUSHBUTTON'))sec.id='pushbutton';
  if(t.includes('04 ·'))sec.id='goldenrules';
  if(t.includes('05 ·'))sec.id='cockpit';
  if(t.includes('06 ·'))sec.id='colors';
  if(t.includes('07 ·'))sec.id='alerts';
  if(t.includes('08 ·'))sec.id='ecam';
 });
}
function addAta(doc){
 if(doc.getElementById('ata'))return;
 const essential=[...doc.querySelectorAll('main>section')].find(s=>(s.querySelector('.eyebrow')?.textContent||'').toUpperCase().includes('LO ESENCIAL'));
 if(!essential)return;
 const s=doc.createElement('section');s.className='section';s.id='ata';
 s.innerHTML='<div class="wrap"><div class="head"><div><div class="eyebrow">10 · ATA COMO MAPA</div><h2>ATA organiza la documentación.</h2></div><p class="lead">Los números ATA ayudan a clasificar y localizar información de sistemas. No definen el orden obligatorio de enseñanza ni la severidad de una alerta.</p></div><div class="patterns"><div class="pattern"><b>ATA 24</b><p>Electrical.</p></div><div class="pattern"><b>ATA 29</b><p>Hydraulic.</p></div><div class="pattern"><b>ATA 34</b><p>Navigation.</p></div><div class="pattern"><b>Idea clave</b><p>ATA es un mapa documental estandarizado.</p></div></div></div>';
 essential.parentNode.insertBefore(s,essential);
}
function addBrand(doc){
 if(doc.querySelector('.airbusMark'))return;
 const st=doc.createElement('style');st.textContent=`.airbusMark{margin-left:auto;margin-right:4px;background:#f1f2f6;padding:7px 13px;display:flex;align-items:center;justify-content:center;min-width:128px}.airbusMark img{display:block;width:106px;height:auto}.reviewCompare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px}.reviewBox{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);padding:10px}.reviewBox small{display:block;color:#8f9bad;text-transform:uppercase;letter-spacing:.12em;font-size:9px;font-weight:900;margin-bottom:4px}.reviewBox strong{font-size:13px}.why{display:block;margin-top:10px}.reviewAction{margin-top:11px;border:1px solid rgba(215,177,90,.45);background:transparent;color:#f0d38d;padding:9px 12px;font-weight:900;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.brandLegal{max-width:1120px;margin:18px auto 0;color:#718094;font-size:10px;line-height:1.45}@media(max-width:760px){.airbusMark{display:none}.reviewCompare{grid-template-columns:1fr}}`;
 doc.head.appendChild(st);
 const top=doc.querySelector('.topin'),tools=doc.querySelector('.tools');if(top&&tools){const m=doc.createElement('div');m.className='airbusMark';m.innerHTML='<img alt="Airbus" src="'+logo+'">';top.insertBefore(m,tools)}
 const last=[...doc.querySelectorAll('main>section')].at(-1);if(last){const p=doc.createElement('p');p.className='brandLegal';p.textContent='Material desarrollado en Veyra Pilot Intelligence. Airbus y su logotipo se utilizan con autorización. El FCOM/FCTM y la documentación aprobada del operador prevalecen.';last.querySelector('.wrap')?.appendChild(p)}
}
function enhance(doc){
 const review=doc.querySelector('#result .review');if(!review)return;
 [...review.children].forEach(card=>{
  if(card.dataset.enhanced==='1')return;
  const b=card.querySelector('b');if(!b)return;
  const q=b.textContent.replace(/^[✓↻]\s*/,'').trim(),m=meta[q];if(!m)return;
  const ok=card.classList.contains('good'),why=card.querySelector('span')?.textContent||'';
  card.dataset.enhanced='1';card.innerHTML='';
  const title=doc.createElement('b');title.textContent=(ok?'✓ ':'↻ ')+q;card.appendChild(title);
  const cmp=doc.createElement('div');cmp.className='reviewCompare';
  const user=doc.createElement('div');user.className='reviewBox';user.innerHTML='<small>Tu respuesta</small><strong>'+((selected[q]||m.correct))+'</strong>';
  const correct=doc.createElement('div');correct.className='reviewBox';correct.innerHTML='<small>Respuesta correcta</small><strong>'+m.correct+'</strong>';
  cmp.append(user,correct);card.appendChild(cmp);
  const w=doc.createElement('span');w.className='why';w.textContent=why;card.appendChild(w);
  if(!ok){const btn=doc.createElement('button');btn.className='reviewAction';btn.textContent='Repasar este concepto →';btn.onclick=()=>doc.getElementById(m.anchor)?.scrollIntoView({behavior:'smooth',block:'start'});card.appendChild(btn)}
 });
}
frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;if(!doc)return;
 setIds(doc);addAta(doc);addBrand(doc);
 doc.addEventListener('click',e=>{const o=e.target.closest('.qopt');if(o){const q=doc.querySelector('#qtext')?.textContent.trim();if(q)selected[q]=stripChoice(o.textContent)}},true);
 const r=doc.querySelector('#result');if(r){new MutationObserver(()=>setTimeout(()=>enhance(doc),0)).observe(r,{childList:true,subtree:true});enhance(doc)}
});
})();
</script>
