<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07111f">
<title>Veyra | A320 Foundations · Clase 5 APU</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}#classFrame{display:block;width:100%;height:100%;border:0;background:#07111f}
</style>
</head>
<body>
<iframe id="classFrame" title="A320 Foundations · Clase 5 · APU — Autonomy & Services" src="class-05-core.html?v=1"></iframe>
<script>
(()=>{
'use strict';
const frame=document.getElementById('classFrame');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d||d.documentElement.dataset.veyraApuImages==='1') return;
  d.documentElement.dataset.veyraApuImages='1';
  const style=d.createElement('style');
  style.textContent=`
    .veyraPhotoFrame{border:1px solid var(--line);background:#03070d;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.22)}
    .veyraPhotoFrame img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#03070d}
    .veyraPhotoCaption{padding:14px 18px;color:var(--muted);font-size:12px;border-top:1px solid rgba(255,255,255,.06)}
    .veyraLocationStack{display:grid;grid-template-columns:1fr;gap:18px}
    .veyraLocationNotes{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:760px){.veyraLocationNotes{grid-template-columns:1fr}}
  `;
  d.head.appendChild(style);
  const sectionByEyebrow=(needle)=>[...d.querySelectorAll('.eyebrow')].find(x=>x.textContent.includes(needle))?.closest('.section');
  const location=sectionByEyebrow('02 · LOCATION');
  const apuMap=location?.querySelector('.apuMap');
  if(apuMap){
    apuMap.className='veyraLocationStack';
    apuMap.innerHTML=`<div class="veyraPhotoFrame"><img src="assets/apu-location-tailcone.jpg?v=2" alt="Ubicación del APU del A320 en el tail cone"><div class="veyraPhotoCaption">Referencia visual de ubicación: el APU se aloja en el cono de cola, detrás del rear pressure bulkhead y fuera del volumen presurizado.</div></div><div class="veyraLocationNotes"><div class="box"><h3>Zona no presurizada</h3><p>El compartimento del APU queda fuera del volumen presurizado.</p></div><div class="box"><h3>Air intake flap</h3><p>MASTER ON no significa arranque instantáneo: primero se prepara el sistema, incluida la admisión.</p></div></div>`;
  }
  const overhead=sectionByEyebrow('08 · OVERHEAD & ECAM');
  const panelGrid=overhead?.querySelector('.twoCol')||overhead?.querySelector('.panelGrid');
  if(overhead&&panelGrid&&!overhead.querySelector('.veyraOverheadPhoto')){
    const photo=d.createElement('div');
    photo.className='veyraPhotoFrame veyraOverheadPhoto';
    photo.style.marginBottom='18px';
    photo.innerHTML=`<img src="assets/apu-overhead-ecam.jpg?v=2" alt="Overhead del A320 con referencia al APU GEN"><div class="veyraPhotoCaption">Referencia visual del overhead: APU GEN forma parte de la interfaz eléctrica asociada al APU. MASTER SW y START se encuentran en el panel APU; la supervisión se completa en ECAM/SD.</div>`;
    panelGrid.parentNode.insertBefore(photo,panelGrid);
  }

  const quizFix={
    '¿Cuál es la función principal del APU?':{correct:1,feedback:'Es una fuente de servicios, no de propulsión.'},
    '¿Qué dos productos entrega?':{correct:0,feedback:'APU GEN y APU BLEED pertenecen a sistemas distintos.'},
    '¿Qué hace el ECB?':{correct:1,feedback:'El ECB automatiza y protege.'},
    '¿Por qué MASTER ON no significa arranque instantáneo?':{correct:0,feedback:'Hay una preparación previa a la secuencia.'},
    '¿Qué significa AVAIL?':{correct:0,feedback:'AVAIL indica disponibilidad; cada servicio depende de su configuración.'},
    '¿APU GEN y APU BLEED pueden gestionarse por separado?':{correct:0,feedback:'Son servicios diferentes.'},
    'Ante pérdida del APU, ¿qué pregunta ayuda más?':{correct:1,feedback:'La consecuencia se analiza en Electrical y Pneumatic.'},
    '¿Los límites son idénticos para electricidad y bleed?':{correct:1,feedback:'Las funciones pueden tener envelopes distintos.'}
  };
  const answers=d.getElementById('answers');
  const question=d.getElementById('question');
  const qfb=d.getElementById('qfb');
  if(answers&&question&&qfb){
    const wireQuiz=()=>{
      const cfg=quizFix[question.textContent.trim()];
      if(!cfg)return;
      answers.dataset.veyraLocked='0';
      [...answers.querySelectorAll('.answer')].forEach((b,i)=>{
        b.onclick=()=>{
          if(answers.dataset.veyraLocked==='1')return;
          answers.dataset.veyraLocked='1';
          [...answers.querySelectorAll('.answer')].forEach((x,n)=>{
            x.classList.remove('ok','no');
            x.removeAttribute('aria-current');
            if(n===cfg.correct)x.classList.add('ok');
            if(n===i&&n!==cfg.correct)x.classList.add('no');
            if(n===i)x.setAttribute('aria-current','true');
          });
          qfb.textContent=cfg.feedback;
          qfb.classList.add('show');
        };
      });
    };
    const observer=new MutationObserver(()=>queueMicrotask(wireQuiz));
    observer.observe(answers,{childList:true});
    wireQuiz();
  }

  d.querySelectorAll('a[href]').forEach(a=>a.target='_top');
});
})();
</script>
</body>
</html>
