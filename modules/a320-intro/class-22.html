<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07111f">
<title>Veyra | A320 Foundations · Clase 22 Normal Procedures Foundations</title>
<style>html,body{margin:0;min-height:100%;background:#07111f;color:#f7f4ed;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;letter-spacing:.14em;color:#a8b5c6}</style>
</head>
<body>
<div class="loading">LOADING CLASE 22…</div>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);
  const build=params.get('v')||params.get('review')||'a320-foundations-v1';
  const version=encodeURIComponent(build);
  const rewriteAssets=html=>html.replace(/((?:src|href)=["']assets\/[^"'?]+)(?:\?v=[^"']*)?(["'])/g,(m,p,q)=>p+'?v='+version+q);
  try{
    const r=await fetch('class-22-core.html?v='+version,{cache:'no-store'});
    if(!r.ok)throw new Error('core '+r.status);
    let h=await r.text();
    h=h.replaceAll('CLASS 22 · NORMAL PROCEDURES','CLASE 22 · NORMAL PROCEDURES FOUNDATIONS')
       .replaceAll('Class 22 · Normal Procedures','Clase 22 · Normal Procedures Foundations')
       .replaceAll('Class 22 Normal Procedures','Clase 22 Normal Procedures Foundations');
    h=rewriteAssets(h);
    document.open();document.write(h);document.close();
  }catch(e){
    console.error(e);document.body.innerHTML='<div class="loading">CLASE 22 COULD NOT LOAD</div>';
  }
})();
</script>
</body>
</html>
