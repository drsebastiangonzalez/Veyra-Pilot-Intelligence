<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07111f">
<title>Veyra | A320 Foundations · Clase 1</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}
iframe{display:block;width:100%;height:100%;border:0;background:#07111f;visibility:hidden;opacity:0;transition:opacity .12s ease}
iframe.ready{visibility:visible;opacity:1}
</style>
</head>
<body>
<iframe id="stage" title="A320 Foundations · Clase 1 · Aircraft General"></iframe>
<script>
(()=>{
'use strict';
const stage=document.getElementById('stage');
const params=new URLSearchParams(location.search);
const build=params.get('v')||params.get('review')||'class01-cache-20260916';
const version=encodeURIComponent(build);
let revealed=false;
const reveal=()=>{if(revealed)return;revealed=true;stage.classList.add('ready')};

function cleanCore(inner){
 try{
  const core=inner?.contentDocument;
  if(!core?.head||!core.body)return false;
  let guard=core.getElementById('veyraClass01LogoGuard');
  if(!guard){
   guard=core.createElement('style');
   guard.id='veyraClass01LogoGuard';
   guard.textContent='.airbus,.heroLogo,.airbusMark,.heroAirbusMark,img[src*="airbus-logo"]{display:none!important}';
   core.head.appendChild(guard);
  }
  core.querySelectorAll('.airbus,.heroLogo,.airbusMark,.heroAirbusMark,img[src*="airbus-logo"]').forEach(el=>el.remove());
  return true;
 }catch(_){return false;}
}

function revealWhenClean(inner){
 let tries=0;
 const check=()=>{
  const cleaned=cleanCore(inner);
  if(cleaned||tries++>=12){
   if(cleaned)setTimeout(()=>cleanCore(inner),120);
   reveal();
   return;
  }
  setTimeout(check,50);
 };
 check();
}

stage.addEventListener('load',()=>{
 try{
  const outer=stage.contentDocument;
  const inner=outer?.getElementById('stage');
  if(!inner){setTimeout(reveal,120);return;}

  const showAfterInnerLoad=()=>revealWhenClean(inner);
  inner.addEventListener('load',showAfterInnerLoad,{once:true});

  const current=inner.getAttribute('src')||'';
  const target='class-01.html?v='+version;
  if(current!==target){inner.src=target;}
  else{showAfterInnerLoad();}
 }catch(_){setTimeout(reveal,600);}
},{once:true});

// Fail-safe: never leave the class hidden if a browser suppresses a nested load event.
setTimeout(reveal,4000);
stage.src='class-01-v2.html?v='+version;
})();
</script>
</body>
</html>
