<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07111f">
<title>Veyra | A320 Foundations · Clase 0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}
iframe{display:block;width:100%;height:100%;border:0;background:#07111f}
</style>
</head>
<body>
<iframe id="stage" title="A320 Foundations · Clase 0" src="class-00-v2.html?v=6"></iframe>
<script>
(()=>{
'use strict';
const stage=document.getElementById('stage');
const zones={
 overhead:['Overhead panel','Controles de sistemas: eléctrico, hidráulico, combustible, neumático, antihielo, fuego, luces y APU.'],
 glareshield:['Glareshield / FCU','FCU, paneles EFIS y Master Warning / Master Caution. Aquí se gestionan gran parte de los modos de autoflight.'],
 main:['Main instrument panel','PFD, ND, EWD y SD, además de las indicaciones principales de vuelo y sistemas.'],
 pedestal:['Pedestal','Thrust levers, engine master switches, MCDU, radios, speedbrake y controles ECAM.'],
 left:['Left side console','Sidestick y controles locales del lado izquierdo.'],
 right:['Right side console','Sidestick y controles locales del lado derecho.']
};
function addStyle(doc){
 if(doc.getElementById('veyraRealCockpitStyle'))return;
 const s=doc.createElement('style');s.id='veyraRealCockpitStyle';
 s.textContent='.airbusMark,.brandLegal{display:none!important}.cockpitMap.realMap{position:relative;display:block!important;min-height:0!important;padding:0!important;background:#02060b!important;overflow:hidden;border:1px solid rgba(215,177,90,.34)}.realMap img{display:block;width:100%;height:auto}.realZone{position:absolute;transform:translate(-50%,-50%);min-width:42px;height:42px;border-radius:999px;border:2px solid #e4bd63;background:rgba(7,17,31,.86);color:#f5d88c;font-weight:900;font-size:12px;box-shadow:0 8px 25px rgba(0,0,0,.45);cursor:pointer}.realZone:hover,.realZone.active{background:#e4bd63;color:#07111f}.realLegend{position:absolute;left:18px;bottom:16px;padding:8px 11px;background:rgba(5,11,19,.86);border:1px solid rgba(215,177,90,.35);color:#e9edf4;font-size:11px;letter-spacing:.05em}.zoneInfo.realInfo p{margin:6px 0 0;color:#aeb8c7}@media(max-width:700px){.realZone{min-width:34px;height:34px;font-size:10px}.realLegend{display:none}}';
 doc.head.appendChild(s);
}
function setInfo(doc,key){
 const box=doc.getElementById('zoneInfo');if(!box)return;
 const data=zones[key];if(!data)return;
 box.classList.add('realInfo');box.replaceChildren();
 const b=doc.createElement('strong');b.textContent=data[0];
 const p=doc.createElement('p');p.textContent=data[1];
 box.append(b,p);
}
function decorate(){
 let inner;
 try{inner=stage.contentDocument&&stage.contentDocument.getElementById('classFrame')}catch(_){return}
 if(!inner)return;
 const apply=()=>{
  let doc;try{doc=inner.contentDocument}catch(_){return}if(!doc||!doc.body)return;
  addStyle(doc);
  doc.querySelectorAll('.airbusMark,.brandLegal').forEach(el=>el.remove());
  let sec=doc.getElementById('cockpit');
  if(!sec)sec=[...doc.querySelectorAll('main>section')].find(s=>(s.querySelector('.eyebrow')?.textContent||'').includes('05'));
  const map=sec&&sec.querySelector('.cockpitMap');if(!map||map.dataset.real==='1')return;
  map.dataset.real='1';map.classList.add('realMap');map.replaceChildren();
  const img=doc.createElement('img');img.src='assets/a320-cockpit-user.jpg';img.alt='Cabina A320 utilizada para identificar las áreas principales del flight deck';img.loading='eager';map.appendChild(img);
  const pts=[['overhead','1','50%','15%'],['glareshield','2','50%','42%'],['main','3','50%','55%'],['pedestal','4','50%','76%'],['left','5','18%','61%'],['right','6','82%','61%']];
  pts.forEach(([key,label,left,top])=>{const b=doc.createElement('button');b.type='button';b.className='realZone';b.textContent=label;b.style.left=left;b.style.top=top;b.setAttribute('aria-label',zones[key][0]);b.addEventListener('click',()=>{map.querySelectorAll('.realZone').forEach(x=>x.classList.remove('active'));b.classList.add('active');setInfo(doc,key)});map.appendChild(b)});
  const legend=doc.createElement('div');legend.className='realLegend';legend.textContent='Selecciona un punto para identificar el panel';map.appendChild(legend);
  setInfo(doc,'overhead');
 };
 inner.addEventListener('load',()=>setTimeout(apply,80),{once:true});
 setTimeout(apply,80);setTimeout(apply,350);
}
stage.addEventListener('load',()=>{decorate();setTimeout(decorate,250)});
})();
</script>
</body>
</html>
