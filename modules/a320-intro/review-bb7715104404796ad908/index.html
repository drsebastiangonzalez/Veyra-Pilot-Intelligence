<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07111f">
<title>Veyra · A320 Foundations Review</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f}#hubFrame{display:block;width:100%;height:100%;border:0;background:#07111f}</style>
</head>
<body>
<iframe id="hubFrame" title="A320 Foundations Internal Review Hub"></iframe>
<script>
(()=>{
'use strict';
const frame=document.getElementById('hubFrame');
const params=new URLSearchParams(location.search);
const build=params.get('v')||params.get('review')||String(Date.now());
const pad=n=>String(n).padStart(2,'0');
function wire(){
  try{
    const d=frame.contentDocument;
    if(!d)return;
    d.querySelectorAll('a[href]').forEach(a=>a.target='_top');
    d.querySelectorAll('.open').forEach(b=>{
      b.onclick=()=>{
        const card=b.closest('.card');
        const n=Number(card?.querySelector('.check input')?.dataset.class);
        if(!Number.isInteger(n)||n<0||n>22)return;
        window.open('class-viewer.html?class='+pad(n)+'&v='+encodeURIComponent(build),'_blank','noopener');
      };
    });
  }catch(e){console.error('Review Hub navigation wiring failed',e)}
}
frame.addEventListener('load',wire);
frame.src='index-core.html?v='+encodeURIComponent(build);
})();
</script>
</body>
</html>
