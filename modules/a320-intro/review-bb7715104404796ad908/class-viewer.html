<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07111f">
<title>Veyra · A320 Foundations</title>
<style>
:root{--bg:#07111f;--ink:#f7f4ed;--muted:#9fb0c3;--gold:#d7b15a;--gold2:#efd48d;--line:rgba(215,177,90,.28)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;flex-direction:column}
.reviewNav{flex:0 0 auto;position:relative;z-index:1000;background:rgba(4,10,18,.97);border-bottom:1px solid var(--line);box-shadow:0 10px 28px rgba(0,0,0,.28);padding:max(8px,env(safe-area-inset-top)) 12px 9px}
.reviewNavIn{max-width:1180px;min-height:42px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:9px}
.navBtn{height:42px;min-height:42px;display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.025);color:var(--ink);font-size:12px;font-weight:850;letter-spacing:.03em;white-space:nowrap;cursor:pointer}.navBtn:hover{border-color:rgba(215,177,90,.62);background:rgba(215,177,90,.08)}.navBtn.prev{justify-self:start}.navBtn.next{justify-self:end}.navBtn.hub{align-self:center;position:relative;top:-1px;color:var(--gold2);letter-spacing:.10em;text-transform:uppercase}
.classMeta{display:none;color:var(--muted);font-size:10px;text-align:center;margin-top:6px;letter-spacing:.08em}#classFrame{display:block;flex:1 1 auto;width:100%;height:0;min-height:0;border:0;background:var(--bg)}
@media(max-width:620px){.reviewNav{padding-left:8px;padding-right:8px}.reviewNavIn{gap:6px}.navBtn{padding:9px 10px;font-size:10px;letter-spacing:0}.navBtn.hub{font-size:9px;letter-spacing:.06em}.classMeta{display:block}}
</style>
</head>
<body>
<nav class="reviewNav" aria-label="Navegación A320 Foundations"><div class="reviewNavIn"><a class="navBtn prev" id="prevBtn" href="#">← Clase anterior</a><a class="navBtn hub" id="hubBtn" href="./">Pilot Intelligence</a><a class="navBtn next" id="nextBtn" href="#">Siguiente clase →</a></div><div class="classMeta" id="classMeta"></div></nav>
<iframe id="classFrame" title="A320 Foundations"></iframe>
<script>
(()=>{
'use strict';
const MAX=22,frame=document.getElementById('classFrame'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),hubBtn=document.getElementById('hubBtn'),classMeta=document.getElementById('classMeta');
const params=new URLSearchParams(location.search),build=params.get('v')||params.get('review')||String(Date.now());
let current=Math.max(0,Math.min(MAX,parseInt(params.get('class')||'0',10)||0));
const pad=n=>String(n).padStart(2,'0');
const route=n=>n===0?'../class-00-v3.html':n===1?'../class-01-v3.html':'../class-'+pad(n)+'.html';
const versioned=p=>p+(p.includes('?')?'&':'?')+'review='+encodeURIComponent(build);
const hubUrl='./?v='+encodeURIComponent(build);hubBtn.href=hubUrl;
const hubAbs=new URL(hubUrl,location.href).href;
const premiumInterestUrl='mailto:veyrapilotintelligence@gmail.com?subject='+encodeURIComponent('A320 Procedures & Operations · Acceso Premium');
const viewerUrl=n=>'class-viewer.html?class='+pad(n)+'&v='+encodeURIComponent(build);
function showPremiumClose(){try{const doc=frame.contentDocument,card=doc&&doc.getElementById('veyraPremiumClose');if(card){card.scrollIntoView({behavior:'smooth',block:'start'});card.classList.add('is-highlighted');setTimeout(()=>card.classList.remove('is-highlighted'),1200)}}catch(_){}}
function updateNav(){document.title='Veyra · A320 Foundations · Clase '+pad(current);classMeta.textContent='A320 FOUNDATIONS · CLASE '+pad(current)+' DE '+pad(MAX);if(current===0){prevBtn.textContent='← Todas las clases';prevBtn.href=hubUrl;prevBtn.onclick=null}else{prevBtn.textContent='← Clase '+pad(current-1);prevBtn.href=viewerUrl(current-1);prevBtn.onclick=e=>{e.preventDefault();go(current-1)}}if(current===MAX){nextBtn.textContent='Siguiente etapa 🔒';nextBtn.href='#premium';nextBtn.onclick=e=>{e.preventDefault();showPremiumClose()}}else{nextBtn.textContent='Clase '+pad(current+1)+' →';nextBtn.href=viewerUrl(current+1);nextBtn.onclick=e=>{e.preventDefault();go(current+1)}}}
function go(n,push=true){current=Math.max(0,Math.min(MAX,n));updateNav();if(push)history.pushState({class:current},'',viewerUrl(current));frame.src=versioned(route(current))}
function classFromHref(href,base){try{const u=new URL(href,base);if(u.origin!==location.origin)return null;const m=u.pathname.match(/\/modules\/a320-intro\/class-(\d{2})(?:-v\d+)?\.html$/i);return m?Number(m[1]):null}catch(_){return null}}
function suppressDuplicateTools(doc){doc.querySelectorAll('.tools').forEach(tools=>{tools.querySelectorAll('a[href]').forEach(a=>{const n=classFromHref(a.getAttribute('href'),doc.baseURI);if(Number.isInteger(n)&&n>=0&&n<=MAX){a.hidden=true;a.setAttribute('aria-hidden','true')}});tools.querySelectorAll('.pill,button,a,span').forEach(el=>{if((el.textContent||'').trim().toUpperCase()==='PILOT INTELLIGENCE'){el.hidden=true;el.setAttribute('aria-hidden','true')}});tools.hidden=![...tools.children].some(el=>!el.hidden)})}
function installPremiumClose(doc){if(current!==MAX||doc!==frame.contentDocument||doc.getElementById('veyraPremiumClose'))return;const make=(tag,className,text)=>{const el=doc.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el};if(!doc.getElementById('veyraPremiumStyles')){const style=make('style');style.id='veyraPremiumStyles';style.textContent=`
@keyframes veyraPremiumIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes veyraPremiumGlow{0%,100%{box-shadow:0 0 0 rgba(215,177,90,0)}50%{box-shadow:0 0 0 6px rgba(215,177,90,.08),0 24px 80px rgba(0,0,0,.46)}}
.veyraPremiumClose{position:relative;isolation:isolate;overflow:hidden;padding:clamp(66px,9vw,112px) 24px 82px;background:#02060b;border-top:1px solid rgba(215,177,90,.22);color:#f7f4ed;animation:veyraPremiumIn .8s ease both}
.veyraPremiumClose:before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 78% 18%,rgba(215,177,90,.15),transparent 28%),radial-gradient(circle at 18% 82%,rgba(103,215,223,.07),transparent 30%),linear-gradient(145deg,#02060b 0%,#050b13 52%,#03070c 100%)}
.veyraPremiumClose:after{content:"";position:absolute;inset:0;z-index:-1;opacity:.45;background:linear-gradient(105deg,transparent 0 47%,rgba(255,255,255,.025) 48%,transparent 49% 100%);background-size:46px 46px}
.veyraPremiumClose.is-highlighted .veyraPremiumInner{animation:veyraPremiumGlow 1.1s ease}
.veyraPremiumInner{width:min(1120px,100%);margin:auto;border:1px solid rgba(215,177,90,.25);background:rgba(7,13,21,.72);backdrop-filter:blur(14px);padding:clamp(30px,5vw,58px);box-shadow:0 30px 90px rgba(0,0,0,.42)}
.veyraPremiumEyebrow{color:#efd48d;font-size:11px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;margin-bottom:18px}
.veyraPremiumBadge{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(215,177,90,.38);border-radius:999px;padding:8px 12px;color:#efd48d;font-size:10px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin-bottom:26px;background:rgba(215,177,90,.05)}
.veyraPremiumTitle{font-family:Georgia,"Times New Roman",serif;font-size:clamp(44px,7vw,88px);font-weight:400;line-height:.94;letter-spacing:-.05em;margin:0 0 24px;max-width:980px}
.veyraPremiumLead{max-width:860px;color:#c5ceda;font-size:clamp(17px,2vw,21px);line-height:1.65;margin:0}
.veyraPremiumLead strong{color:#f7f4ed}.veyraPremiumLine{margin:28px 0 0;color:#efd48d;font-weight:800;font-size:clamp(16px,2vw,20px)}
.veyraPremiumFeatures{display:flex;gap:9px;flex-wrap:wrap;margin:30px 0 0}.veyraPremiumFeatures span{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.025);border-radius:999px;padding:9px 12px;color:#aebdce;font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
.veyraPremiumActions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}.veyraPremiumPrimary,.veyraPremiumSecondary{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:13px 20px;text-decoration:none;font-size:11px;font-weight:950;letter-spacing:.11em;text-transform:uppercase}.veyraPremiumPrimary{background:linear-gradient(135deg,#f0d58e,#c99e49);color:#07111f;border:1px solid #efd48d}.veyraPremiumSecondary{background:transparent;color:#f7f4ed;border:1px solid rgba(255,255,255,.16)}
.veyraPremiumNote{margin:22px 0 0;color:#6f7d8e;font-size:11px;line-height:1.5;max-width:820px}
@media(max-width:620px){.veyraPremiumClose{padding:52px 16px 62px}.veyraPremiumInner{padding:28px 20px}.veyraPremiumActions{display:grid}.veyraPremiumPrimary,.veyraPremiumSecondary{width:100%}.veyraPremiumTitle{font-size:clamp(42px,14vw,62px)}}
`;doc.head.appendChild(style)}const section=make('section','veyraPremiumClose');section.id='veyraPremiumClose';const inner=make('div','veyraPremiumInner');inner.append(make('div','veyraPremiumEyebrow','FOUNDATIONS COMPLETADO'));const badge=make('div','veyraPremiumBadge','PREMIUM · A320 PROCEDURES & OPERATIONS');inner.append(badge,make('h2','veyraPremiumTitle','Ya conoces el A320. Ahora aprende a operarlo.'));const lead=make('p','veyraPremiumLead');lead.append('Has construido la base: sistemas, lógica, indicaciones y arquitectura. ',make('strong','', 'La siguiente etapa convierte ese conocimiento en secuencia de cabina.'),' En A320 Procedures & Operations pasarás de saber qué hace el avión a entrenar qué hacer, cuándo y en qué orden: Flows, Normal Operations, roles PF/PM, checklists y aplicación por fase de vuelo.');inner.append(lead,make('p','veyraPremiumLine','Lo siguiente no es más teoría. Es convertir conocimiento en acción.'));const features=make('div','veyraPremiumFeatures');['Flow Philosophy','Cockpit Preparation','PF / PM','Normal Operations','Phase of Flight'].forEach(text=>features.appendChild(make('span','',text)));inner.appendChild(features);const actions=make('div','veyraPremiumActions');const primary=make('a','veyraPremiumPrimary','QUIERO CONTINUAR →');primary.href=premiumInterestUrl;primary.target='_top';const secondary=make('a','veyraPremiumSecondary','VOLVER A FOUNDATIONS');secondary.href=hubAbs;secondary.target='_top';actions.append(primary,secondary);inner.append(actions,make('p','veyraPremiumNote','Acceso Premium. La siguiente etapa se habilita únicamente para usuarios con acceso activo. Material educativo: la documentación aprobada del operador prevalece.'));section.appendChild(inner);doc.body.appendChild(section)}
function wireDocument(doc){if(!doc||!doc.documentElement)return;const wire=()=>{suppressDuplicateTools(doc);installPremiumClose(doc);doc.querySelectorAll('a[href]').forEach(a=>{if(a.dataset.veyraViewerWired==='1')return;const n=classFromHref(a.getAttribute('href'),doc.baseURI);if(Number.isInteger(n)&&n>=0&&n<=MAX){a.dataset.veyraViewerWired='1';a.target='_self';a.addEventListener('click',e=>{e.preventDefault();go(n)})}});doc.querySelectorAll('.pill,button,a,span').forEach(el=>{if(el.closest('.tools')||(el.textContent||'').trim().toUpperCase()!=='PILOT INTELLIGENCE'||el.dataset.veyraHubWired==='1')return;el.dataset.veyraHubWired='1';el.setAttribute('role','link');el.setAttribute('tabindex','0');el.style.cursor='pointer';const back=e=>{e.preventDefault();location.href=hubUrl};el.addEventListener('click',back);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();location.href=hubUrl}})});doc.querySelectorAll('iframe').forEach(f=>wireFrame(f))};wire();if(doc.documentElement.dataset.veyraViewerObserved!=='1'){doc.documentElement.dataset.veyraViewerObserved='1';new MutationObserver(()=>queueMicrotask(wire)).observe(doc.documentElement,{subtree:true,childList:true})}}
function wireFrame(f){if(f.dataset.veyraFrameWired!=='1'){f.dataset.veyraFrameWired='1';f.addEventListener('load',()=>{try{wireDocument(f.contentDocument)}catch(_){}})}try{wireDocument(f.contentDocument)}catch(_){}}
frame.addEventListener('load',()=>wireFrame(frame));window.addEventListener('popstate',()=>{const p=new URLSearchParams(location.search),n=parseInt(p.get('class')||String(current),10);go(Number.isFinite(n)?n:current,false)});go(current,false);
})();
</script>
</body>
</html>
