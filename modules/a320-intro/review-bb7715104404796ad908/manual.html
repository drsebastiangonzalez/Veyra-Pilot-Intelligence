<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07111f">
<title>Veyra · A320 Foundations Manual v1.0 Review</title>
<style>
:root{--bg:#07111f;--ink:#f7f4ed;--muted:#9fb0c3;--gold:#d7b15a;--cyan:#67d7df;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 82% 4%,rgba(103,215,223,.08),transparent 28%),linear-gradient(#050b13,var(--bg));color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px}.box{max-width:620px;width:100%;border:1px solid var(--line);border-radius:22px;padding:30px;background:rgba(255,255,255,.025);text-align:center}.veyra{font:2rem Georgia,serif}.tag{margin-top:8px;color:var(--gold);font-size:.72rem;letter-spacing:.16em;font-weight:800}.status{margin-top:24px;color:var(--muted);line-height:1.6}.bar{height:3px;margin-top:20px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:14%;background:linear-gradient(90deg,var(--gold),var(--cyan));animation:run 1.3s ease-in-out infinite alternate}.error{color:#f0c8c8}.back{display:inline-block;margin-top:18px;color:var(--cyan);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 13px}@keyframes run{to{width:100%}}
</style>
</head>
<body><div class="load"><div class="box"><div class="veyra">Veyra</div><div class="tag">A320 FOUNDATIONS · MANUAL v1.0 CANDIDATE</div><div class="status" id="status">Preparando el manual de revisión…</div><div class="bar" id="bar"><i></i></div><a class="back" href="./">← Volver al Review Hub</a></div></div>
<script>
(async()=>{
 const files=['c1.txt','c1b.txt','c1c.txt','c02.txt','c02b.txt','c03.txt','c04.txt','c05.txt','c06.txt','c07.txt','c08.txt'];
 const status=document.getElementById('status');
 try{
  if(typeof DecompressionStream==='undefined') throw new Error('Este navegador no soporta DecompressionStream. Actualiza Safari/iOS para abrir el manual.');
  const chunks=[];
  for(let i=0;i<files.length;i++){
   status.textContent=`Cargando manual… ${i+1} / ${files.length}`;
   const r=await fetch('manual-data/'+files[i]+'?v=1',{cache:'no-store'});
   if(!r.ok) throw new Error('No se pudo cargar '+files[i]+' ('+r.status+')');
   chunks.push((await r.text()).trim());
  }
  status.textContent='Abriendo manual…';
  const raw=atob(chunks.join(''));
  const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
 }catch(e){
  console.error(e);document.getElementById('bar').style.display='none';status.className='status error';status.textContent='No fue posible abrir el manual: '+e.message;
 }
})();
</script></body></html>
