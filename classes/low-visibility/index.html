<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veyra · Low Visibility Operations (LVO) · Clase interactiva</title>
<meta name="description" content="Clase interactiva de operaciones de baja visibilidad: ILS, luces, RVR, CAT II/III, LVP, LVTO y degradaciones en final.">
<meta name="theme-color" content="#0B1014">
<link rel="canonical" href="https://veyrapilot.com/classes/low-visibility/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1014; --panel:#13161D; --line:#232830; --line2:#2E343D;
    --gold:#D8B25E; --gold-dim:#8F7640; --ink:#FFFFFF; --muted:#9AA3AD; --dim:#5F6873;
    --ok:#7FBF8E; --bad:#D9776C;
    --serif:"Lora",Georgia,serif; --sans:"Poppins",Arial,sans-serif;
    --rail:240px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  a{color:var(--gold)}

  .app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100%}
  /* rail */
  .rail{border-right:1px solid var(--line);padding:28px 22px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:inherit}
  .rail-links{display:flex;gap:8px;flex-wrap:wrap}
  .rail-links a{font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line2);padding:7px 9px;border-radius:4px;color:var(--muted)}
  .rail-links a:hover,.rail-links a:focus-visible{color:var(--gold);border-color:var(--gold-dim)}
  .source-note{margin-top:14px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:4px;color:var(--muted);font-size:12px;line-height:1.6;max-width:680px}
  .brand .w{font-family:var(--serif);font-size:22px;color:var(--ink)}
  .brand .t{font-size:8px;letter-spacing:.22em;color:var(--muted)}
  .rail h2{font-family:var(--serif);font-weight:400;font-size:15px;margin:0;color:var(--muted)}
  .blocks{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
  .blocks li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px;font-size:12.5px;color:var(--dim);cursor:default}
  .blocks li .dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--line2);flex:none}
  .blocks li.done{color:var(--muted);cursor:pointer}
  .blocks li.done .dot{background:var(--gold-dim);border-color:var(--gold-dim)}
  .blocks li.active{color:var(--ink);background:var(--panel)}
  .blocks li.active .dot{background:var(--gold);border-color:var(--gold)}
  .score{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.6}
  .score b{color:var(--gold);font-weight:500}

  /* stage */
  .stage{display:flex;flex-direction:column;min-height:100vh}
  .topbar{height:3px;background:var(--line)}
  .topbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .5s ease}
  .step{flex:1;padding:56px 64px 40px;max-width:980px;width:100%;margin:0 auto;opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease}
  .step.in{opacity:1;transform:none}
  .kicker{font-size:12px;color:var(--gold);margin:0 0 10px}
  h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.2;margin:0 0 14px;letter-spacing:-.01em}
  h1.big{font-size:44px}
  .lead{font-size:16px;color:var(--muted);line-height:1.65;max-width:640px;margin:0 0 28px}
  p{line-height:1.7;max-width:660px;margin:0 0 14px;font-size:15px}
  .note{border-left:2px solid var(--gold);padding:10px 16px;color:var(--muted);font-size:14px;line-height:1.6;max-width:640px;margin:18px 0}
  .note b{color:var(--ink);font-weight:500}

  /* reveals */
  .reveals{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:10px;max-width:680px}
  .reveals li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:4px;opacity:0;transform:translateX(-8px);transition:opacity .35s ease,transform .35s ease;line-height:1.55;font-size:14.5px}
  .reveals li.show{opacity:1;transform:none}
  .reveals li .n{font-family:var(--serif);color:var(--gold);font-size:20px;line-height:1}
  .reveals li b{color:var(--ink);font-weight:500;display:block;margin-bottom:3px}
  .reveals li span{color:var(--muted)}
  .hint{font-size:12.5px;color:var(--dim);margin-top:14px}

  /* nav */
  .nav{display:flex;justify-content:space-between;align-items:center;padding:18px 64px 36px;max-width:980px;width:100%;margin:0 auto;gap:12px}
  .btn{background:transparent;border:1px solid var(--line2);color:var(--ink);padding:11px 20px;border-radius:4px;font-size:13.5px;font-weight:400;cursor:pointer;transition:border-color .2s,background .2s}
  .btn:hover{border-color:var(--gold)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn.primary{background:var(--gold);color:#1B1608;border-color:var(--gold);font-weight:500}
  .btn.primary:hover{background:#E2C177}
  .btn[disabled]{opacity:.35;cursor:not-allowed}
  .counter{font-size:12px;color:var(--dim)}

  /* quiz */
  .q{max-width:680px}
  .q .prompt{font-family:var(--serif);font-size:22px;line-height:1.4;margin:0 0 22px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;color:var(--ink);font-size:14.5px;line-height:1.5;cursor:pointer;display:grid;grid-template-columns:26px 1fr;gap:12px;transition:border-color .2s,background .2s;font-weight:300}
  .opt .k{color:var(--muted);font-family:var(--serif)}
  .opt:hover{border-color:var(--gold-dim)}
  .opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .opt.right{border-color:var(--ok)} .opt.right .k{color:var(--ok)}
  .opt.wrong{border-color:var(--bad)} .opt.wrong .k{color:var(--bad)}
  .opt.locked{cursor:default}
  .opt.locked:not(.right):not(.wrong){opacity:.45}
  .fb{margin-top:18px;padding:16px 18px;border-radius:4px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--muted);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
  .fb.show{opacity:1;transform:none}
  .fb b{font-weight:500}
  .fb.ok b{color:var(--ok)} .fb.ko b{color:var(--bad)}

  /* widgets */
  .widget{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 24px;margin-top:8px}
  .widget h3{font-family:var(--serif);font-weight:400;font-size:18px;margin:0 0 6px}
  .widget .sub{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.5}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:6px;min-width:180px;flex:1}
  .field label{font-size:12px;color:var(--muted)}
  .field output{font-family:var(--serif);font-size:24px;color:var(--gold)}
  input[type=range]{width:100%;accent-color:var(--gold);background:transparent}
  .readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px}
  .readout div{border:1px solid var(--line);border-radius:4px;padding:12px 14px}
  .readout small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .readout strong{font-family:var(--serif);font-weight:400;font-size:20px;color:var(--ink)}
  .readout strong.g{color:var(--gold)} .readout strong.b{color:var(--bad)} .readout strong.o{color:var(--ok)}
  .verdict{margin-top:14px;font-size:14px;line-height:1.6;color:var(--muted);min-height:44px}
  .verdict b{color:var(--ink);font-weight:500}

  /* metar chips */
  .metar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px;font-family:"Courier New",monospace;font-size:17px}
  .chip{border:1px solid var(--line2);border-radius:4px;padding:8px 10px;cursor:pointer;background:var(--bg);color:var(--ink);transition:border-color .2s,color .2s;font-family:inherit;font-size:inherit;font-weight:700}
  .chip:hover{border-color:var(--gold-dim)}
  .chip.on{border-color:var(--gold);color:var(--gold)}
  .chip.seen{color:var(--muted)} .chip.seen.on{color:var(--gold)}
  .decode{min-height:120px;border:1px solid var(--line);border-radius:4px;padding:16px 18px;font-size:14px;line-height:1.6;color:var(--muted)}
  .decode b{color:var(--ink);font-weight:500;display:block;font-family:var(--serif);font-size:17px;margin-bottom:6px}
  .decode em{color:var(--gold);font-style:normal}
  .meter{font-size:12px;color:var(--dim);margin-top:10px}

  /* taf timeline */
  .taf{font-family:"Courier New",monospace;font-size:13.5px;line-height:1.9;color:var(--muted);white-space:pre-wrap;border:1px solid var(--line);border-radius:4px;padding:14px 16px;background:var(--bg)}
  .taf span{display:block;padding:0 6px;border-radius:3px;transition:background .25s,color .25s}
  .taf span.live{background:#1C2A20;color:var(--ink)} .taf span.live.bad{background:#2B1C1B}
  .tl{position:relative;height:28px;margin:18px 0 6px;border-radius:3px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
  .tl .seg{position:absolute;top:0;bottom:0;background:var(--gold-dim);opacity:.35}
  .tl .seg.bad{background:var(--bad);opacity:.35}
  .tl .cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--gold)}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}

  /* microburst */
  .mb svg{width:100%;height:auto;display:block}
  .phases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .phase{border:1px solid var(--line);border-radius:4px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--dim);transition:border-color .3s,color .3s}
  .phase b{display:block;color:inherit;font-weight:500;margin-bottom:4px}
  .phase.on{border-color:var(--gold);color:var(--ink)} .phase.on b{color:var(--gold)}

  /* results */
  .results{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:22px 0}
  .res{border:1px solid var(--line);border-radius:4px;padding:14px 16px}
  .res small{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
  .res strong{font-family:var(--serif);font-weight:400;font-size:26px}
  .res .bar{height:3px;background:var(--line);margin-top:10px}
  .res .bar i{display:block;height:100%;background:var(--gold)}
  .grade{font-family:var(--serif);font-size:64px;color:var(--gold);line-height:1;margin:6px 0 4px}

  /* intro */
  .cover{display:grid;grid-template-columns:1fr 280px;gap:40px;align-items:center}
  .rings{aspect-ratio:1;position:relative}
  .rings i{position:absolute;inset:0;border:1px solid var(--line2);border-radius:50%;animation:breathe 6s ease-in-out infinite}
  .rings i:nth-child(2){inset:22%;animation-delay:-2s}
  .rings i:nth-child(3){inset:44%;border-color:var(--gold);animation-delay:-4s}
  .rings b{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;background:var(--gold);border-radius:50%}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.04);opacity:1}}
  .mission{border:1px solid var(--gold-dim);border-radius:6px;padding:18px 20px;margin-top:22px;max-width:640px}
  .mission h4{font-family:var(--serif);font-weight:400;margin:0 0 8px;font-size:17px;color:var(--gold)}
  .mission p{margin:0;font-size:14px;color:var(--muted)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 20px;border-right:0;border-bottom:1px solid var(--line)}
    .rail h2,.score{display:none}
    .blocks{flex-direction:row;flex-wrap:wrap;gap:6px}
    .blocks li{padding:5px 8px;font-size:0}
    .blocks li .dot{width:10px;height:10px}
    .step{padding:32px 22px 20px}
    .nav{padding:12px 22px 28px}
    h1{font-size:27px} h1.big{font-size:32px}
    .cover{grid-template-columns:1fr}
    .rings{max-width:180px}
    .phases{grid-template-columns:1fr}
  }

  .stack{display:flex;flex-direction:column-reverse;gap:3px;height:300px;justify-content:flex-start;border:1px solid var(--line);border-radius:4px;padding:8px;background:var(--bg)}
  .layer{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:3px;font-size:12px;color:#1B1608;min-height:14px;transition:flex .4s ease,opacity .4s}
  .layer span:last-child{font-family:var(--serif);font-size:13px}
  .l-taxi{background:#5F6873;color:#fff}.l-trip{background:#8F7640;color:#fff}.l-cont{background:#B59748}.l-alt{background:#C9A853}.l-frf{background:#D8B25E}.l-extra{background:#E6CC8A}.l-disc{background:#F1E1B4}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:12px}
  .legend b{color:var(--ink);font-weight:500}
  .two{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
  .toggle{display:flex;gap:6px;flex-wrap:wrap}
  .tg{border:1px solid var(--line2);background:transparent;color:var(--muted);padding:7px 12px;border-radius:4px;font-size:12.5px;cursor:pointer}
  .tg.on{border-color:var(--gold);color:var(--gold)}
  .gauge{position:relative;height:34px;border:1px solid var(--line);border-radius:4px;background:var(--bg);overflow:hidden;margin-top:10px}
  .gauge i{position:absolute;top:0;bottom:0;transition:width .2s linear}
  .gauge .mk{position:absolute;top:0;bottom:0;width:2px;background:var(--bad)}
  .status{font-family:var(--serif);font-size:22px;margin-top:12px;min-height:30px}
  .status.warn{color:var(--gold)} .status.bad{color:var(--bad)} .status.ok{color:var(--ok)}
  @media (max-width:900px){.two{grid-template-columns:1fr}}

  /* --- escenas --- */
  .scene{background:#070A0D;border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:8px}
  .scene svg{width:100%;height:auto;display:block}
  .lgd{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .lgd .tg{display:inline-flex;align-items:center;gap:8px}
  .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
  .exp{margin-top:12px;border:1px solid var(--line);border-radius:4px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:var(--muted);min-height:70px}
  .exp b{color:var(--ink);font-weight:500;display:block;font-family:var(--serif);font-size:16px;margin-bottom:4px}
  .exp i{color:var(--gold);font-style:normal}
  .def{border:1px solid var(--gold-dim);border-radius:4px;padding:10px 14px;margin:8px 0 0;font-size:13px;line-height:1.55;color:var(--muted)}
  .def b{color:var(--gold);font-weight:500}
  .ra{font-family:var(--serif);font-size:30px;color:var(--ink)}
  .fma{display:inline-block;font-family:"Courier New",monospace;font-weight:700;font-size:14px;padding:5px 12px;border:1px solid #3A414B;border-radius:3px;color:#7FBF8E;background:#0B1014}
  .fma.deg{color:var(--gold)} .fma.bad{color:var(--bad)}
  @keyframes strobe{0%,8%{opacity:1}12%,100%{opacity:.08}}
  .strobe{animation:strobe 1.6s linear infinite}
  @keyframes beacon{0%,100%{opacity:.25}50%{opacity:1}}
  .beacon{animation:beacon 2s ease-in-out infinite}
  @keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-120px)}}
  .fogdrift{animation:drift 14s linear infinite}
  .glos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:14px}
  .glos div{border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:12.5px;line-height:1.5;color:var(--muted)}
  .glos b{color:var(--gold);font-weight:500}
  .cover .rings{display:none}
  .runway-cover{width:100%;max-width:320px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <a class="brand" href="../" aria-label="Volver a Classes"><span class="w">Veyra</span><span class="t">PILOT INTELLIGENCE</span></a>
    <h2>Low Visibility · LVO</h2>
    <div class="rail-links"><a href="../">Classes</a><a href="/?view=training">Training Center</a></div>
    <ol class="blocks" id="blocks"></ol>
    <div class="score" id="railScore"></div>
  </aside>
  <main class="stage">
    <div class="topbar"><i id="bar"></i></div>
    <section class="step" id="step" aria-live="polite"></section>
    <div class="nav">
      <button class="btn" id="prev">Anterior</button>
      <span class="counter" id="counter"></span>
      <button class="btn primary" id="next">Continuar</button>
    </div>
  </main>
</div>

<script>
/* ===================== CONTENIDO ===================== */
const BLOCKS=["Bienvenida","El ILS desde cero","Las luces","Ver en la niebla: RVR","Categorías y la decisión","LVP y despegue","En final: degradaciones","Resultado y glosario"];

const STEPS=[
 {b:0,t:"intro"},
 {b:0,t:"lesson",k:"Cómo funciona esta clase",h:"Ver, tocar, comprobar",
  lead:"Un recorrido visual de baja visibilidad: seis escenas interactivas y trece comprobaciones. Nada se lee sin verse: cada concepto tiene su dibujo y cada dibujo responde a lo que muevas.",
  items:[
   {t:"La misión",d:"Escenario didáctico: 05:30 en Bogotá con RVR 400 m y techo de 100 ft; destino Rionegro con niebla temporal. ¿Puede despegar? ¿Puede aterrizar? ¿Qué limitación manda?"},
   {t:"Sin peajes",d:"Los puntos aparecen solos. Tras responder, la clase avanza sola (puedes adelantarte con el botón). Un clic por pantalla."},
   {t:"Desde cero",d:"Cada sigla se define la primera vez que aparece, y al final hay un glosario con todas."},
   {t:"Regla de la clase",d:"Las cifras de aeródromo, aeronave y operador se usan para aprender. En operación real mandan AIP/NOTAM, AFM/FCOM, MEL, aprobación LVO y Manual de Operaciones vigentes."}
  ]},

 /* ---------- 1 · ILS ---------- */
 {b:1,t:"lesson",k:"Bloque 1 · El ILS desde cero",h:"Qué es un ILS",
  lead:"ILS significa Instrument Landing System. El localizador aporta guía lateral y la senda de planeo guía vertical; juntos forman el pasillo electrónico hacia la pista. La distancia puede venir de DME u otra fuente publicada: no es un tercer componente obligatorio del ILS.",
  items:[
   {t:"Localizador (LOC)",d:"Antena al final de la pista. Emite un haz que dice si estás a la izquierda o a la derecha del eje de pista. En el PFD (la pantalla principal del piloto) se ve como un rombo que se mueve de lado."},
   {t:"Senda de planeo (GS, glide slope)",d:"Antena junto a la zona de toma. Emite un haz inclinado 3° que dice si estás alto o bajo. En el PFD es un rombo que sube o baja."},
   {t:"Distancia",d:"Cuando la aproximación lo publica, un DME u otra fuente aprobada ayuda a saber cuánto falta. Las marker beacons son una ayuda heredada que todavía puede aparecer en algunos procedimientos, pero no definen por sí solas un ILS moderno."}
  ]},
 {b:1,t:"widget",id:"ils",k:"Escena · El pasillo del ILS",h:"Mueve el avión y mira cómo responden los rombos del PFD"},
 {b:1,t:"lesson",k:"Bloque 1 · El ILS desde cero",h:"Tres alturas que no son lo mismo",
  items:[
   {t:"DA/H · decisión",d:"La carta publica una altitud/altura de decisión para la aproximación. En CAT I la DA/H suele referenciarse barométricamente; si en la DA/H no existe la referencia visual requerida, se ejecuta la aproximación frustrada.",ex:"CAT I se define con DH no inferior a 200 ft; el mínimo real puede ser mayor."},
   {t:"DH en CAT II/III",d:"En CAT II y en CAT III con DH, EASA exige que la DH se determine mediante radioaltímetro o un medio equivalente cuando así lo determine la certificación. La cifra depende de la aproximación, aeronave, tripulación y aprobación.",ex:"CAT II: DH no menor de 100 ft; el RVR mínimo puede aumentar si la DH es mayor."},
   {t:"AH · altura de alerta",d:"En operaciones fail-operational puede existir una Alert Height: por encima de ella ciertas fallas requieren abandonar la aproximación; por debajo, el sistema certificado puede conservar la capacidad prevista. El valor es específico de aeronave/configuración y del procedimiento del operador.",ex:"Cualquier AH mostrada en esta clase es un supuesto de entrenamiento, no un valor universal del A320."}
  ]},
 {b:1,t:"quiz",q:"¿Qué le dice el localizador al piloto?",o:["Si está alto o bajo respecto a la senda","Cuánto falta para la pista","Si está a la izquierda o a la derecha del eje de pista","La velocidad del viento"],a:2,
  fb:"El localizador es la referencia lateral; la senda de planeo (GS) es la vertical; el DME o las balizas dan la distancia."},

const GLOSSARY=[["ILS","Instrument Landing System. Localizador (lateral) + senda de planeo (vertical) + distancia."],["LOC","Localizador: haz que indica desviación izquierda/derecha del eje."],["GS","Glide slope, senda de planeo: haz a 3° que indica alto/bajo."],["PFD","Primary Flight Display: pantalla principal con actitud, velocidad, altitud y desviaciones ILS."],["FMA","Flight Mode Annunciator: franja superior del PFD donde se anuncian los modos y la capacidad (CAT 3 DUAL…)."],["DA","Decision Altitude: altitud barométrica de decisión (CAT I)."],["DH","Decision Height: altura de decisión por radioaltímetro (CAT II/III)."],["AH","Alert Height: altura usada en algunas operaciones fail-operational; su valor es específico de aeronave/configuración y procedimiento."],["RA","Radioaltímetro: mide la altura real hasta el suelo."],["RVR","Runway Visual Range: alcance visual en pista medido por transmisómetros (TDZ, MID, STOP-END)."],["CMV","Converted Meteorological Visibility. Puede sustituir RVR en casos permitidos; no se usa para mínimos de despegue ni para continuar una aproximación LVO."],["LVP","Low Visibility Procedures: medidas del aeródromo para proteger el ILS y el movimiento en tierra."],["LVTO","Low Visibility Take-Off: despegue con RVR < 550 m; en EASA, RVR < 400 m requiere aprobación específica."],["Fail-passive","Tras una falla, el sistema no desvía la trayectoria pero no completa el aterrizaje: exige DH ≥ 50 ft."],["Fail-operational","Tras una falla prevista, el sistema conserva capacidad suficiente para completar la operación según su certificación; puede soportar operaciones sin DH cuando estén específicamente aprobadas."],["Autoland","Aterrizaje automático: LAND, FLARE, ROLL OUT."],["Approach ban","Restricción EASA a continuar más allá de 1.000 ft sobre la elevación del aeródromo (o el FAS, según el caso) cuando el VIS/RVR controlante está por debajo del mínimo."],["Área sensible","Zona junto a las antenas ILS donde un avión o vehículo deforma la señal; se protege en LVP."],["Stop bar","Barra de luces rojas en la calle de rodaje; encendida, nunca se cruza."],["TDZ","Touchdown zone: zona de toma, primeros 900 m, con barras de luces blancas."],["HUD","Head-Up Display: guía proyectada en el parabrisas; permite LVTO a 75 m."],["ALS","Approach Lighting System: luces de aproximación (Calvert, ALSF-1, ALSF-2, MALSR)."],["ALSF-2","ALS de 2.400 ft con barras rojas laterales; sistema CAT II/III en EE. UU."],["ALSF-1","ALS de 2.400 ft para CAT I de alta intensidad."],["MALSR","ALS de intensidad media de 1.400 ft con RAIL; CAT I."],["SFL / RAIL","Destellos secuenciales que corren hacia la pista."],["HIRL / MIRL / LIRL","Luces de borde de pista (RL) de alta, media o baja intensidad."],["CL / RCLL","Luces de eje de pista cada 15 m; rojo y blanco en los últimos 900 m."],["RCLM","Marcas pintadas de eje de pista; no sirven en niebla."],["TDZL","Luces de zona de toma, primeros 900 m."],["PAPI","Indicador visual de senda: 2 blancas + 2 rojas = en senda."],["REIL","Destellos de identificación del umbral."],["SPA.LVO","Aprobación específica EASA para operaciones de baja visibilidad."]];

let idx=0; const answers={}; let autoT=null;

try{ const saved=JSON.parse(localStorage.getItem("veyra-lvo2")||"null"); if(saved){ idx=saved.idx||0; Object.assign(answers,saved.answers||{}); } }catch(e){}

function cancelAuto(){ if(autoT){ clearInterval(autoT); autoT=null; } }
function autoNext(btn,secs){ cancelAuto(); if(!btn) return; const base=btn.textContent.replace(/ · \d+$/,""); let n=secs; btn.textContent=base+" · "+n;
  autoT=setInterval(()=>{ if(!document.contains(btn)||btn.disabled){ cancelAuto(); return; } n--; if(n<=0){ cancelAuto(); btn.textContent=base; btn.click(); } else btn.textContent=base+" · "+n; },1000); }

    w.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(w,+b.dataset.i)); if(prev) setTimeout(()=>answer(w,prev.a,true),0); }
  else if(s.t==="widget"){ w.innerHTML=`<p class="kicker">${s.k}</p><h1>${s.h}</h1><div class="widget" id="wg"></div>`; WIDGETS[s.id](w.querySelector("#wg")); }

function answer(w,i,replay){ const s=STEPS[idx]; if(answers[idx]&&!replay) return; const ok=i===s.a; answers[idx]={a:i,ok};
  w.querySelectorAll(".opt").forEach((b,j)=>{ b.classList.add("locked"); if(j===s.a) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); b.disabled=true; });

      const ev=EV[i]; elm.querySelector("#fma").textContent="CAT 3 DUAL"; elm.querySelector("#fma").className="fma"; elm.querySelector("#qa").innerHTML=""; const t0=performance.now();
      const tick=t=>{ const u=Math.min(1,(t-t0)/4000); const h=1000-u*(1000-ev.at); pl.setAttribute("transform",`translate(${hx(h)} ${hy(h)}) rotate(8)`); elm.querySelector("#ra").textContent="RA "+Math.round(h);
        if(u<1){ raf=requestAnimationFrame(tick); rafs.push(raf); } else { const f=elm.querySelector("#fma"); f.textContent=ev.fma; f.className="fma "+ev.cls; ask(ev); } };
      raf=requestAnimationFrame(tick); rafs.push(raf); };
    const ask=ev=>{ const qa=elm.querySelector("#qa"); qa.innerHTML=`<p class="prompt" style="font-size:17px;margin:14px 0 10px">${ev.q}</p><div class="opts" id="o">${ev.o.map((o,j)=>`<button class="opt" data-i="${j}"><span class="k">${"AB"[j]}</span><span>${o}</span></button>`).join("")}</div><div class="fb" id="fb"></div><div class="row" style="margin-top:12px"><button class="btn" id="nx" disabled>Siguiente evento</button></div>`;
      qa.querySelectorAll("#o .opt").forEach(b=>b.onclick=()=>{ const j=+b.dataset.i; qa.querySelectorAll("#o .opt").forEach((x,k)=>{ x.disabled=true; x.classList.add("locked"); if(k===ev.a) x.classList.add("right"); else if(k===j) x.classList.add("wrong"); }); const ok=j===ev.a; if(ok) score++; elm.querySelector("#score").textContent=`${score} correctas`; const fb=qa.querySelector("#fb"); fb.className="fb show "+(ok?"ok":"ko"); fb.innerHTML=`<b>${ok?"Correcto.":"No es esa."}</b> ${ev.why}`; qa.querySelector("#nx").disabled=false; autoNext(qa.querySelector("#nx"),5); });
      qa.querySelector("#nx").onclick=()=>{ i++; run(); }; };
    elm.querySelector("#play").onclick=()=>{ i=0; score=0; run(); elm.querySelector("#play").textContent="Reiniciar"; };
  }
};

/* ===================== NAV ===================== */
nextB.onclick=()=>{ cancelAuto(); const s=STEPS[idx]; if(s.t==="results"){ idx=0; for(const k in answers) delete answers[k]; go(); return; } if(idx<STEPS.length-1){ idx++; go(); } };
prevB.onclick=()=>{ cancelAuto(); if(idx>0){ idx--; go(); } };
document.addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT") return; if(e.key==="ArrowRight"&&!nextB.disabled) nextB.click(); if(e.key==="ArrowLeft") prevB.click(); });
go();
