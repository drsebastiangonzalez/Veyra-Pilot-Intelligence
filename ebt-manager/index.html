let EXPAND_ICAP = false; let EDIT_ICAP = false;
function icapData() { const b = D.icap; const o = S.icap && Array.isArray(S.icap.sessions) ? S.icap : null; return o ? { ...b, ...o, targets: { ...b.targets, ...(o.targets || {}) } } : b; }
function icapTotals(sessions) { const t = { n: 0, conc: 0, noConc: 0, noAlign: 0, agree: 0 }; sessions.forEach(s => Object.keys(t).forEach(k => { t[k] += +s[k] || 0; })); const pct = k => t.n ? Math.round(t[k] / t.n * 100) : 0; return { ...t, pConc: pct('conc'), pNoConc: pct('noConc'), pNoAlign: pct('noAlign'), pAgree: pct('agree') }; }
function icapLineSvg(ic) {
  const ss = ic.sessions; const n = ss.length; if (!n) return '<div class="empty">Sin sesiones.</div>';
  const W = 760, H = 300, pl = 44, pr = 82, pt = 18, pb = 44;
  const x = i => pl + (n === 1 ? 0 : i * (W - pl - pr) / (n - 1)); const y = v => pt + (H - pt - pb) * (1 - v / 100);
  const pcts = ss.map(s => s.n ? Math.round(s.conc / s.n * 100) : 0); const T = icapTotals(ss);
  const tgt = +ic.targets.conc || 85, avg = T.pConc;
  let g = '';
  for (let v = 0; v <= 100; v += 10) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--rule2)"/><text x="${pl - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink3)">${v}%</text>`;
  const path = pcts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p).toFixed(1)).join(' ');
  g += `<line x1="${pl}" x2="${W - pr}" y1="${y(tgt).toFixed(1)}" y2="${y(tgt).toFixed(1)}" stroke="var(--due)" stroke-width="2.5"/><text x="${W - pr + 6}" y="${(y(tgt) + 3).toFixed(1)}" font-size="10" font-weight="700" fill="var(--due)">${tgt}% meta</text>`;
  g += `<line x1="${pl}" x2="${W - pr}" y1="${y(avg).toFixed(1)}" y2="${y(avg).toFixed(1)}" stroke="var(--ink)" stroke-width="2"/><text x="${W - pr + 6}" y="${(y(avg) + 3).toFixed(1)}" font-size="10" font-weight="700" fill="var(--ink)">${avg}% real</text>`;
  g += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pcts.forEach((p, i) => { g += `<circle cx="${x(i).toFixed(1)}" cy="${y(p).toFixed(1)}" r="3.5" fill="var(--accent)"><title>${ss[i].date}: ${p}% (${ss[i].conc} de ${ss[i].n})</title></circle><text x="${x(i).toFixed(1)}" y="${(y(p) + (p >= avg ? -8 : 14)).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="${p >= tgt ? 'var(--ok)' : p < avg ? 'var(--due)' : 'var(--ink)'}">${p}%</text><text x="${x(i).toFixed(1)}" y="${H - pb + 16}" text-anchor="middle" font-size="9.5" fill="var(--ink2)">${esc(ss[i].date)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="icapline" role="img" aria-label="Concordancia por sesión frente a la meta">${g}</svg>
  <div class="legend"><span class="lg"><i style="background:var(--accent)"></i>Concordancia por sesión</span><span class="lg"><i style="background:var(--due)"></i>Meta ${tgt}%</span><span class="lg"><i style="background:var(--ink)"></i>Promedio real ${avg}%</span></div>`;
}
function icapStackSvg(ic, kind) {
  // kind 'conc': concordancia vs no concordancia; 'agree': acuerdo vs sin acuerdo (n − agreement)
  const ss = ic.sessions; const n = ss.length; if (!n) return '';
  const W = 760, H = 220, pl = 34, pr = 10, pt = 14, pb = 40; const gw = (W - pl - pr) / n, bw = Math.min(40, gw * 0.62);
  const maxN = Math.max(...ss.map(s => +s.n || 0)) || 1; const y = v => pt + (H - pt - pb) * (1 - v / maxN);
  const a = kind === 'conc' ? { k: 'conc', color: 'var(--ok)', label: 'Concordancia', other: 'No concordancia', ocolor: 'var(--due)' } : { k: 'agree', color: 'var(--accent)', label: 'Acuerdo', other: 'Sin acuerdo', ocolor: 'var(--warn)' };
  let g = '';
  for (let v = 0; v <= maxN; v += 5) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--rule2)"/><text x="${pl - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink3)">${v}</text>`;
  ss.forEach((s, i) => { const N = +s.n || 0, v = +s[a.k] || 0, o = Math.max(0, N - v); const x0 = pl + i * gw + (gw - bw) / 2;
    g += `<rect x="${x0.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw}" height="${(y(0) - y(v)).toFixed(1)}" fill="${a.color}"><title>${s.date}: ${a.label} ${v} de ${N}</title></rect>`;
    g += `<rect x="${x0.toFixed(1)}" y="${y(N).toFixed(1)}" width="${bw}" height="${(y(v) - y(N)).toFixed(1)}" fill="${a.ocolor}"><title>${s.date}: ${a.other} ${o}</title></rect>`;
    if (v) g += `<text x="${(x0 + bw / 2).toFixed(1)}" y="${(y(v / 2) + 3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${v}</text>`;
    if (o) g += `<text x="${(x0 + bw / 2).toFixed(1)}" y="${(y(v + o / 2) + 3.5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">${o}</text>`;
    g += `<text x="${(x0 + bw / 2).toFixed(1)}" y="${H - pb + 14}" text-anchor="middle" font-size="9.5" fill="var(--ink2)">${esc(s.date)}</text><text x="${(x0 + bw / 2).toFixed(1)}" y="${H - pb + 26}" text-anchor="middle" font-size="9" fill="var(--ink3)">${N ? Math.round(v / N * 100) : 0}%</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="icapline" role="img" aria-label="${a.label} por sesión">${g}</svg><div class="legend"><span class="lg"><i style="background:${a.color}"></i>${a.label}</span><span class="lg"><i style="background:${a.ocolor}"></i>${a.other}</span></div>`;
}

    x.fcts.forEach(id => { const key = `guide|${x.s}|${id}|${x.t.slice(0, 48)}`; if (FC[id] && !seen.has(key)) { seen.add(key); items.push({ key, group: 'Guía del instructor M1 → lista FCTS', el: x.s, left: x.t, right: `FCTS ${FC[id].sys}: ${FC[id].mal}` }); } });

    ev.ex.forEach(id => { if (EX[id]) items.push({ key: `fda|${ev.id}|${id}`, group: 'Boletín FDA → JET MATRIX', el: ev.name, left: `${ev.name}`, right: `JET ${TOPIC[EX[id].topic].name}: ${EX[id].gm}` }); });
  });
  Object.entries(RSMV_LINKS).forEach(([r, l]) => [...l.ex, ...l.fcts].forEach(id => items.push({ key: `link|rsmv|${r}|${id}`, group: 'Enlaces planificador → RSMV', el: RSMV_NAME[r], left: `Maniobra ${RSMV_NAME[r]}`, right: EX[id] ? `JET ${TOPIC[EX[id].topic].name}: ${EX[id].gm}` : `FCTS ${FC[id].sys}: ${FC[id].mal}` })));

  if (!ME.canWrite && WRITE_CHANGES.has(act)) { denyWrite(); render(); return; }
  if (act === 'inc') { toggleInclude(t.dataset.v); }
  else if (act === 'ex') { const en = entry(t.dataset.el || S.sel, S.module, S.fleet, true); const id = t.dataset.v; en.ex = t.checked ? [...new Set([...en.ex, id])] : en.ex.filter(x => x !== id);
    if (t.checked) { EVPICK = { el: t.dataset.el || S.sel, id }; }
    else if (en.ev) delete en.ev[id];
    afterPick(id, t.checked); save(); render(); }
  else if (act === 'fc') { const en = entry(S.sel, S.module, S.fleet, true); const id = t.dataset.v; en.fcts = t.checked ? [...new Set([...en.fcts, id])] : en.fcts.filter(x => x !== id); afterPick(id, t.checked); save(); render(); }
  else if (act === 'malfPick') { const st = S.malf[S.fleet] ||= {}; st[S.module] ||= []; const id = t.dataset.v; if (t.checked) { if (!st[S.module].includes(id)) st[S.module].push(id); } else { st[S.module] = st[S.module].filter(x => x !== id); } save(); render(); }
  else if (act === 'onlyDue') { S.filters.onlyDue = t.checked; save(); render(); }
  else if (act === 'valPending') { VAL_ONLY_PENDING = t.checked; render(); }
  else if (act === 'asstQuick') { CHAT_QUICK = t.checked; }
  else if (act === 'valGroup') { VAL_GROUP = t.value; render(); }
  else if (act === 'valNote') { if (!ME.canWrite) { denyWrite(); return; } const key = t.dataset.key; S.validation ||= {}; S.validation[key] = { ...(S.validation[key] || { status: 'adjust' }), note: t.value.trim(), by: ME.name || 'Editor', date: new Date().toLocaleDateString('es-CO') }; save(); }
  else if (act === 'phase') { S.filters.phase = t.value; save(); render(); }
  else if (act === 'ph') { S.filters.ph = t.value; save(); render(); }
  else if (act === 'link') { S.links[S.fleet][t.dataset.k] = t.value.trim(); save(); render(); }
  else if (act === 'p2') { S.perf2 ||= {}; const c = t.dataset.c; const v = parseFloat(t.value); if (isFinite(v) && v >= 1 && v <= 5) S.perf2[c] = +v.toFixed(2); else delete S.perf2[c]; save(); render(); }
  else if (act === 'sigName') { const key = t.dataset.key; if (key.startsWith('L:')) { const r = key.slice(2); LEGACY[r] = { ...(LEGACY[r] || {}), name: t.value.trim() }; saveLegacy(); } else if (ME.uid) { SIGS[ME.uid] = { ...(SIGS[ME.uid] || {}), name: t.value.trim() }; if (SIGS[ME.uid].img) saveMySignature(SIGS[ME.uid]); } }
  else if (act === 'teamRole') { TEAM_ROLE = t.value; }
  else if (act === 'sigUpload') {
    const key = t.dataset.key; const file = t.files && t.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => {
        const maxW = 700, sc = Math.min(1, maxW / im.naturalWidth); const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * sc); cv.height = Math.round(im.naturalHeight * sc);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); let url = cv.toDataURL('image/png'); if (url.length > 120000) url = cv.toDataURL('image/jpeg', 0.85);
        if (url.length > 200000) { toast('La imagen es demasiado grande; usa una más pequeña'); return; }
        const name = ((app.querySelector(`input[data-act="sigName"][data-key="${key}"]`) || {}).value || '').trim();
        storeSignature(key, { name, img: url, date: new Date().toLocaleDateString('es-CO') }); };
      im.onerror = () => toast('No se pudo leer la imagen'); im.src = rd.result; };
    rd.readAsDataURL(file);
  }
  else if (act === 'pfNote') { const st = S.pf[S.fleet]; st[S.module] ||= {}; const p = st[S.module][t.dataset.id] ||= { CM1: [], CM2: [], note: '' }; p.note = t.value; save(); }
});
let qTimer = null;
app.addEventListener('input', ev => {
  const t = ev.target; if (!t.dataset.act) return;
  if (t.dataset.act === 'gq') { clearTimeout(qTimer); SEARCH_Q = t.value; qTimer = setTimeout(() => { const pos = t.selectionStart; render(); const n = app.querySelector('#gq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }, 200); return; }
  if (t.dataset.act === 'teamQ') { clearTimeout(qTimer); TEAM_Q = t.value; qTimer = setTimeout(async () => { try { TEAM_HITS = store.user ? await store.user.search(TEAM_Q) : []; } catch (e) { TEAM_HITS = []; } const pos = t.selectionStart; render(); const n = app.querySelector('#teamQ'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }, 350); return; }
  if (t.dataset.act === 'note') {
    if (!ME.canWrite) { denyWrite(); return; }
    const existed = !!entry(S.sel); const en = entry(S.sel, S.module, S.fleet, true); en.note = t.value;
    clearTimeout(qTimer); qTimer = setTimeout(save, 400);
    if (!existed) { save(); const pos = t.selectionStart; render(); const n = app.querySelector('[data-act="note"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }
    return;
  }
  if (t.dataset.act === 'pfNote') { clearTimeout(qTimer); const st = S.pf[S.fleet]; st[S.module] ||= {}; const p = st[S.module][t.dataset.id] ||= { CM1: [], CM2: [], note: '' }; p.note = t.value; qTimer = setTimeout(save, 400); return; }
  if (t.dataset.act === 'q' || t.dataset.act === 'fq') {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { S.filters[t.dataset.act] = t.value; save(); const pos = t.selectionStart; render(); const n = app.querySelector(`[data-act="${t.dataset.act}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }, 250);
  }
});
document.addEventListener('keydown', ev => {
  const tag = (ev.target && ev.target.tagName) || ''; const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (ev.target && ev.target.isContentEditable);
  if (ev.key === 'Escape' && HELP_STEP >= 0) { HELP_STEP = -1; render(); return; }
  if (typing) return;
  if (ev.key === 'ArrowRight' && S.module < 6) { S.module++; save(); render(); toast('M' + S.module); }
  else if (ev.key === 'ArrowLeft' && S.module > 1) { S.module--; save(); render(); toast('M' + S.module); }
  else if (ev.key === '/') { ev.preventDefault(); S.view = 'search'; render(true); const n = app.querySelector('#gq'); if (n) n.focus(); }
});
app.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && ev.target.dataset && ev.target.dataset.act === 'asstIn') { ev.preventDefault(); const q = ev.target.value; ev.target.value = ''; askAssistant(q); return; }
  if (ev.key !== 'Enter') return;
  const map = { grName: 'nameSave', customIn: 'addCustom', newElIn: 'addEl', coT: 'addCompany', coD: 'addCompany', siItem: 'addSysItem', siFmt: 'addSysItem', mfName: 'addMalf', edT: 'saveCompany', edD: 'saveCompany', edItem: 'saveSysItem', edFmt: 'saveSysItem', edCustom: 'saveCustom' };
  if (map[ev.target.id]) { ev.preventDefault(); const btn = app.querySelector(`[data-act="${map[ev.target.id]}"]`); if (btn) btn.click(); }
});

/* ===== Diagnóstico: cualquier error de ejecución se muestra en pantalla ===== */
window.addEventListener('error', ev => { try { toast('Error: ' + (ev.message || 'desconocido')); } catch (e) { /* nada */ } });
window.addEventListener('unhandledrejection', ev => { try { const r = ev.reason; toast('Error: ' + (r && (r.message || r.code) || String(r))); } catch (e) { /* nada */ } });

/* ===== Arranque ===== */
setTimeout(() => { loadLocal(); try { if (!localStorage.getItem('ebt-help-seen')) HELP_STEP = 0; } catch (e) { } render(); initStore(); initSample(); }, 60);

</script>
