<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EBT Manager | Avianca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#EEF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --ink:#16243A; --ink2:#4A5567; --ink3:#7A8496;
  --rule:#D5DAE1; --rule2:#E6EAEF; --accent:#1252B8; --accent-ink:#FFFFFF; --accent-soft:#E3ECFA;
  --brand:#DA291C; --brand-soft:#FBE7E4;
  --due:#B3261E; --due-soft:#FBE7E4; --ok:#1B7A47; --ok-soft:#E1F3E8; --info:#4A5B70; --info-soft:#E9EDF2; --warn:#B06A00; --warn-soft:#FBEBD3;
  --catA:#0E7C86; --catB:#B06A00; --catC:#6A3FB5; --catO:#4A5B70;
  --catA-soft:#DDF3F5; --catB-soft:#FBEBD3; --catC-soft:#EDE4FA; --catO-soft:#E9EDF2;
  --shadow:0 1px 2px rgba(22,36,58,.06), 0 4px 14px rgba(22,36,58,.05);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0F1722; --surface:#182231; --surface2:#1F2B3C; --ink:#EEF2F7; --ink2:#B8C2D0; --ink3:#8E9AAB;
    --rule:#2E3A4C; --rule2:#26313F; --accent:#7FAEFF; --accent-ink:#0F1722; --accent-soft:#233657;
    --brand:#DA291C; --brand-soft:#4A2228;
    --due:#FF8C7F; --due-soft:#4A2622; --ok:#6FD39A; --ok-soft:#1E3E2C; --info:#B8C2D0; --info-soft:#26313F; --warn:#F2B75E; --warn-soft:#43311A;
    --catA:#5CD3DD; --catB:#F2B75E; --catC:#C4A6F5; --catO:#B8C2D0;
    --catA-soft:#153B40; --catB-soft:#43311A; --catC-soft:#332747; --catO-soft:#26313F;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
    --canvas:#0F1722; --surface:#182231; --surface2:#1F2B3C; --ink:#EEF2F7; --ink2:#B8C2D0; --ink3:#8E9AAB;
    --rule:#2E3A4C; --rule2:#26313F; --accent:#7FAEFF; --accent-ink:#0F1722; --accent-soft:#233657;
    --brand:#DA291C; --brand-soft:#4A2228;
    --due:#FF8C7F; --due-soft:#4A2622; --ok:#6FD39A; --ok-soft:#1E3E2C; --info:#B8C2D0; --info-soft:#26313F; --warn:#F2B75E; --warn-soft:#43311A;
    --catA:#5CD3DD; --catB:#F2B75E; --catC:#C4A6F5; --catO:#B8C2D0;
    --catA-soft:#153B40; --catB-soft:#43311A; --catC-soft:#332747; --catO-soft:#26313F;
    --shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; height:100%; background:var(--canvas); color:var(--ink); font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:0; padding:0}
button:disabled{cursor:default; opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
a{color:var(--accent)}
img{max-width:100%}
input[type=text],input[type=search],input[type=url],select,textarea{padding:7px 10px; border:1px solid var(--rule); border-radius:8px; background:var(--surface); font-size:13px}
input[type=checkbox]{accent-color:var(--accent)}

/* ===== Splash ===== */
.splash{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px}
.splash-brand{display:flex; align-items:center; gap:12px}
.splash-brand img{height:56px; width:auto}
.splash-brand span{font-weight:800; font-size:38px; letter-spacing:-.03em; color:var(--brand); line-height:1}
.splash-bar{width:220px; max-width:70vw; height:6px; border-radius:3px; background:var(--rule2); overflow:hidden}
.splash-bar i{display:block; width:40%; height:100%; border-radius:3px; background:var(--brand); animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)} 100%{transform:translateX(260%)}}
.splash p{margin:0; color:var(--ink3); font-size:13px}
@media (prefers-reduced-motion: reduce){ .splash-bar i{animation:none; width:100%} }
/* ===== Top strip ===== */
.strip{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--rule); padding:0 20px; box-shadow:var(--shadow)}
.strip::before{content:""; display:block; height:3px; background:var(--brand); margin:0 -20px}
.strip-row{display:flex; align-items:center; gap:12px; row-gap:2px; flex-wrap:wrap; padding:5px 0 4px}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.brand .mark{display:flex; align-items:center; gap:7px; border-radius:8px; padding:2px 4px}
.brand .mark:hover{background:var(--surface2)}
.brand .logo{height:25px; width:auto}
.brand .word{font-weight:800; font-size:18px; letter-spacing:-.03em; color:var(--brand); line-height:1}
.brand .ttl{display:flex; flex-direction:column; border-left:1px solid var(--rule); padding-left:10px}
.brand .ttl b{font-weight:800; font-size:13px; letter-spacing:-.01em; line-height:1.15}
.brand .ttl span{color:var(--ink3); font-size:10.5px}
.brand button.home{font-weight:700; color:var(--ink2); padding:6px 10px; border-radius:8px; border:1px solid var(--rule)}
.brand button.home:hover{background:var(--surface2)}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; background:var(--surface2)}
.seg button{padding:5px 11px; font-size:13px; font-weight:700; color:var(--ink2); border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface)}
.seg.aocseg button{padding:4px 8px; font-size:11px; letter-spacing:.02em}
.seg.aocseg button[aria-pressed="false"]{color:var(--ink3); opacity:.6; text-decoration:line-through}
body.ro .seg.aocseg button{opacity:.45; pointer-events:none}
@media (max-width:1520px){ .brand .ttl span{display:none} }
@media (max-width:1330px){ .store{display:none} .mod{min-width:46px} }
.timeline{display:flex; align-items:flex-end; margin-left:auto}
.year{display:flex; flex-direction:column; align-items:center; padding:0 4px; border-left:1px solid var(--rule)}
.year:first-child{border-left:0}
.year small{color:var(--ink3); font-size:9.5px; margin-bottom:1px}
.year div{display:flex; gap:3px}
.mod{display:flex; flex-direction:column; align-items:center; gap:1px; padding:3px 6px; border-radius:7px; min-width:50px; border:1px solid transparent}
.mod b{font-weight:800; font-size:13px; line-height:1}
.mod small{font-size:9.5px; color:var(--ink3); white-space:nowrap}
.mod .dots{display:flex; gap:2px; margin-top:1px; height:4px}
.mod .dots i{display:block; width:7px; height:4px; border-radius:2px; background:var(--rule)}
.mod .dots i.on{background:var(--ok)} .mod .dots i.part{background:var(--catB)}
.mod[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.mod[aria-pressed="true"] b{color:var(--accent)}
.store{font-size:10.5px; color:var(--ink3); display:flex; align-items:center; gap:5px; white-space:nowrap}
.store i{width:7px; height:7px; border-radius:50%; background:var(--ink3); display:inline-block}
.store.db i{background:var(--ok)} .store.local i{background:var(--warn)}
.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.tabs button{padding:5px 12px 7px; font-size:13px; font-weight:600; color:var(--ink2); border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tabs button .n{display:inline-block; min-width:18px; padding:0 5px; border-radius:9px; background:var(--accent-soft); color:var(--accent); font-size:11px; font-weight:700; margin-left:5px; line-height:18px; vertical-align:1px}
.crumb{display:flex; align-items:center; gap:8px; padding:8px 0 10px; font-size:13px; color:var(--ink3)}
.crumb b{color:var(--ink); font-weight:700}
.crumb button{color:var(--accent); font-weight:600}

/* ===== Layout & generic ===== */
.main{padding:18px 20px 48px; max-width:1500px}
.pane,.card{background:var(--surface); border:1px solid var(--rule); border-radius:12px}
.card{padding:16px 18px}
.card h2,.sec-head h1{margin:0; font-size:18px; font-weight:800; letter-spacing:-.01em}
.card h2 small,.sec-head small{font-weight:400; color:var(--ink3); font-size:12.5px; margin-left:8px}
.sec-head{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; margin:2px 0 14px}
.sec-head h1{font-size:22px}
.sec-head p{margin:4px 0 0; color:var(--ink2); max-width:70ch}
.sec-head .acts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; background:var(--info-soft); color:var(--info)}
.pill.due{background:var(--due-soft); color:var(--due)} .pill.ok{background:var(--ok-soft); color:var(--ok)} .pill.warn{background:var(--warn-soft); color:var(--warn)} .pill.must{background:var(--due-soft); color:var(--due)}
.pill.A{background:var(--catA-soft); color:var(--catA)} .pill.B{background:var(--catB-soft); color:var(--catB)} .pill.C{background:var(--catC-soft); color:var(--catC)} .pill.O{background:var(--catO-soft); color:var(--catO)}
.btn{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-weight:700; border:1px solid var(--rule); background:var(--surface); color:var(--ink); white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.brand{background:var(--brand); color:#fff; border-color:var(--brand)}
.btn.danger{color:var(--due)}
.btn.sm{padding:5px 10px; font-size:12.5px; font-weight:600}
.btn svg{width:15px; height:15px}
.tag{font-size:11px; font-weight:700; color:var(--ink3); border:1px solid var(--rule); border-radius:5px; padding:1px 6px; white-space:nowrap}
.hint{color:var(--ink3); font-size:12.5px; margin:4px 0 0}
.empty{padding:22px 16px; color:var(--ink3); border:1px dashed var(--rule); border-radius:9px; margin-top:8px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--surface); padding:9px 14px; border-radius:8px; font-weight:600; font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50}
.toast.show{opacity:1}
.stack{display:grid; gap:14px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}

/* ===== Home ===== */
.welcome{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:2px 0 14px; flex-wrap:wrap}
.welcome h1{margin:0; font-size:28px; font-weight:800; letter-spacing:-.02em}
.welcome p{margin:4px 0 0; color:var(--ink2)}
.hero{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:14px; align-items:stretch}
.hero .card h1{margin:0 0 4px; font-size:26px; font-weight:800; letter-spacing:-.02em}
.hero .card p{margin:0; color:var(--ink2); max-width:60ch}
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px}
.kpi{padding:12px 14px; border-radius:10px; background:var(--surface2); border:1px solid var(--rule2)}
.kpi b{display:block; font-size:26px; font-weight:800; line-height:1.05; letter-spacing:-.02em}
.kpi span{font-size:12px; color:var(--ink3)}
.kpi.due b{color:var(--due)} .kpi.ok b{color:var(--ok)}
.aocs{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px; margin-top:10px}
.aoc{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px; border-radius:10px; border:1px solid var(--rule2); background:var(--surface2); cursor:pointer; font:inherit; color:var(--ink); transition:border-color .18s, opacity .18s}
.aoc b{font-size:13px; font-weight:800; letter-spacing:.05em}
.aoc .sw{position:relative; width:34px; height:20px; border-radius:999px; background:var(--rule); transition:background .18s; flex:none}
.aoc .sw i{position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:left .18s}
.aoc[aria-checked="true"]{border-color:var(--ok)}
.aoc[aria-checked="true"] .sw{background:var(--ok)}
.aoc[aria-checked="true"] .sw i{left:16px}
.aoc[aria-checked="false"]{opacity:.7}
.aoc[aria-checked="false"] b{color:var(--ink3)}
body.ro .aoc{opacity:.45; pointer-events:none}
.ring{display:flex; align-items:center; gap:14px}
.ring svg{width:92px; height:92px; flex:none}
.ring .lbl{font-size:12.5px; color:var(--ink2)}
.ring .lbl b{display:block; font-size:15px; color:var(--ink)}
.targets{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.tchip{padding:4px 10px; border-radius:999px; font-weight:800; font-size:12.5px; background:var(--accent-soft); color:var(--accent)}
.tchip.sug{background:var(--warn-soft); color:var(--warn); border:1px dashed var(--warn)} .tchip small{font-weight:600; font-size:11px}
.menu{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px}
.tile{display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:16px 16px 14px; text-align:left; background:var(--surface); border:1px solid var(--rule); border-radius:12px; min-height:150px; transition:transform .12s, box-shadow .12s}
.tile:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--ink3)}
.tile .ic{width:40px; height:40px; border-radius:10px; display:grid; place-items:center; color:#fff}
.tile .ic svg{width:22px; height:22px}
.tile .num{position:absolute}
.tile h3{margin:0; font-size:15px; font-weight:800; line-height:1.2}
.tile p{margin:0; font-size:12.5px; color:var(--ink3); line-height:1.35}
.tile .st{margin-top:auto; font-size:12.5px; font-weight:700}
.tile .st.due{color:var(--due)} .tile .st.ok{color:var(--ok)} .tile .st.info{color:var(--ink2)}
.tile .top{display:flex; align-items:center; gap:10px; width:100%}
.tile .top small{margin-left:auto; font-weight:800; color:var(--ink3); font-size:13px}
.links li{display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--rule2); flex-wrap:wrap}
.links li:first-child{border-top:0}
.links ul{list-style:none; margin:6px 0 0; padding:0}
.links .lab{font-weight:700; min-width:140px}
.links input{flex:1; min-width:160px}
.links a.btn{text-decoration:none}
.logo-box{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.logo-box .prev{height:44px; min-width:120px; display:flex; align-items:center; justify-content:center; border:1px dashed var(--rule); border-radius:8px; padding:4px 10px; background:var(--surface2)}
.logo-box .prev img{max-height:36px}

/* ===== Planner (list + detail) ===== */
.plan{display:grid; grid-template-columns:360px minmax(0,1fr); gap:16px; align-items:start}
.plan > *{min-width:0}
.gm,.fr span,.res-head h3{overflow-wrap:anywhere}
.list{position:sticky; top:calc(var(--strip-h,120px) + 12px); max-height:calc(100vh - var(--strip-h,120px) - 28px); display:flex; flex-direction:column}
.list-head{padding:12px 14px 10px; border-bottom:1px solid var(--rule); display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.list-head h2{margin:0; font-size:14px; font-weight:700}
.list-head label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2); margin-left:auto; cursor:pointer}
.list-body{overflow:auto; padding-bottom:8px}
.cat-head{padding:12px 14px 5px; font-size:12px; font-weight:700; color:var(--ink2); display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.cat-head em{font-style:normal; font-weight:400; color:var(--ink3)}
.el-row{display:grid; grid-template-columns:5px 22px 1fr auto; gap:10px; align-items:center; width:100%; padding:7px 12px 7px 10px; text-align:left; border-top:1px solid var(--rule2)}
.el-row:hover{background:var(--surface2)}
.el-row[aria-current="true"]{background:var(--accent-soft)}
.el-row .rail{width:5px; height:100%; min-height:30px; border-radius:3px; background:var(--rule)}
.rail.A{background:var(--catA)} .rail.B{background:var(--catB)} .rail.C{background:var(--catC)} .rail.O{background:var(--catO)}
.el-row input{width:16px; height:16px; margin:0}
.el-row .nm{font-weight:600; line-height:1.25}
.el-row .st{display:block; font-size:11.5px; font-weight:400; color:var(--ink3); margin-top:2px}
.el-row .st.due{color:var(--due); font-weight:600} .el-row .st.ok{color:var(--ok)} .el-row .st.must{color:var(--due); font-weight:700}
.el-row .cnt{font-size:11.5px; color:var(--ink3); white-space:nowrap}
.el-row .cnt.has{color:var(--accent); font-weight:700}
.detail{min-height:400px}
.det-head{padding:16px 20px 12px; border-bottom:1px solid var(--rule)}
.det-head .top{display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap}
.det-head h1{margin:0; font-size:22px; font-weight:800; letter-spacing:-.015em; line-height:1.15}
.det-head .meta{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center}
.cover{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap}
.cover span{display:inline-flex; flex-direction:column; align-items:center; padding:5px 9px; border-radius:7px; border:1px solid var(--rule); font-size:12px; color:var(--ink3); min-width:58px}
.cover span b{font-weight:800; color:var(--ink2)}
.cover span.on{background:var(--ok-soft); border-color:var(--ok); color:var(--ok)} .cover span.on b{color:var(--ok)}
.cover span.cur{outline:2px solid var(--accent); outline-offset:1px}
.filters{position:sticky; top:var(--strip-h,120px); z-index:5; background:var(--surface); padding:10px 20px; border-bottom:1px solid var(--rule); display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.filters .chips{display:flex; gap:5px; flex-wrap:wrap}
.chip{padding:4px 10px; border-radius:999px; border:1px solid var(--rule); font-size:12.5px; font-weight:700; color:var(--ink2); background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.chip.tgt{border-color:var(--accent)}
.evov{position:fixed; inset:0; background:rgba(3,10,20,.55); z-index:60; display:flex; align-items:center; justify-content:center; padding:20px}
.evbox{background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:18px 20px; max-width:560px; width:100%; max-height:85vh; overflow:auto; box-shadow:var(--shadow)}
.evbox h3{margin:0 0 4px; font-size:16px}
.evg{margin-top:10px} .evg b{font-size:11.5px; color:var(--ink3); letter-spacing:.05em; text-transform:uppercase}
.evg > div{display:flex; gap:6px; flex-wrap:wrap; margin-top:5px}
.evtag{cursor:pointer; font:inherit; font-size:11px}
.sesst{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-top:10px}
.sess{border:1px solid var(--rule); border-radius:10px; padding:10px 12px; background:var(--surface2)}
.sess h4{margin:0 0 6px; font-size:13px}
.sess ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px}
.sess li{font-size:12.5px; color:var(--ink2); line-height:1.35} .sess li b{color:var(--ink); font-weight:700}
.p2grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px}
.p2c{display:flex; flex-direction:column; gap:3px; font-size:12px}
.p2c b{color:var(--ink2); font-weight:700}
.p2c input{padding:6px 8px; border:1px solid var(--rule); border-radius:8px; background:var(--surface2); color:var(--ink); font:inherit; width:100%}
.p2c input:focus{border-color:var(--accent); outline:none}
body.ro .p2c input{opacity:.5; pointer-events:none}
.insbar{display:flex; align-items:center; gap:10px; padding:5px 6px; width:100%; text-align:left; font:inherit; color:var(--ink); border-radius:8px}
button.insbar{cursor:pointer} button.insbar:hover{background:var(--surface2)}

.sres{list-style:none; margin:10px 0 0; padding:0} .sres li{border-top:1px solid var(--rule2)} .sres li button{display:grid; grid-template-columns:auto 1fr; gap:4px 10px; width:100%; text-align:left; padding:8px 4px; align-items:baseline} .sres li button:hover{background:var(--surface2)}
.sres li button b{font-size:13px} .sres li button span{grid-column:2; font-size:12px; color:var(--ink3)}
.ovl{position:fixed; inset:0; background:rgba(22,36,58,.45); z-index:60; display:grid; place-items:center; padding:20px}
.ovlbox{background:var(--surface); border-radius:14px; padding:22px 24px; max-width:520px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ovlbox .dot{width:8px; height:8px; border-radius:50%; background:var(--rule); display:inline-block; margin-right:5px} .ovlbox .dot.on{background:var(--brand)}
.card.remind{border-color:var(--accent); background:var(--accent-soft)}
@media (max-width:900px){ .valrow{grid-template-columns:1fr} }
/* ===== Asistente ===== */
.chat .chatlog{max-height:52vh; overflow:auto; padding:4px 2px; display:flex; flex-direction:column; gap:8px}
.chat.compact .chatlog{max-height:38vh}
.msg{display:flex} .msg.user{justify-content:flex-end}
.msg .mb{max-width:88%; padding:9px 12px; border-radius:12px; font-size:13.5px; line-height:1.45; white-space:normal; overflow-wrap:anywhere}
.msg.user .mb{background:var(--ink); color:var(--surface); border-bottom-right-radius:4px}
.msg.assistant .mb{background:var(--surface2); border:1px solid var(--rule2); border-bottom-left-radius:4px}
.msg.err .mb{background:var(--due-soft); color:var(--due)}
.chatin{margin-top:8px; display:grid; gap:6px} .chatin textarea{width:100%; resize:vertical}
.dock{position:fixed; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:45; display:flex; flex-direction:column; align-items:flex-end; gap:10px}
.dockbtn{display:inline-flex; align-items:center; gap:8px; padding:11px 16px; border-radius:999px; background:var(--brand); color:#fff; font-weight:800; box-shadow:0 8px 24px rgba(0,0,0,.22)}
.dockbtn svg{width:18px; height:18px}
.dockbox{width:min(400px, calc(100vw - 36px)); background:var(--surface); border:1px solid var(--rule); border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,.25); overflow:hidden}
@media (max-width:600px){ .dockbtn span{display:none} .dockbtn{padding:12px} }
/* ===== Aclaraciones ===== */
.note{background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:12px 14px; margin:0 0 14px; color:var(--ink); font-size:13px; line-height:1.5}
.note b{font-weight:800}
.note .pairs{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.note .pair{padding:3px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--rule); font-size:12px; font-weight:700; color:var(--ink2)}
.note .pair.cur{border-color:var(--accent); color:var(--accent)}
/* ===== Matrices ===== */
.mx{width:100%; border-collapse:separate; border-spacing:0; font-size:13px}
.mx th,.mx td{padding:6px 8px; border-bottom:1px solid var(--rule2); vertical-align:middle}
.mx th{font-size:12px; color:var(--ink2); font-weight:700; background:var(--surface2); text-align:center; position:sticky; top:0; z-index:1}
.mx th:first-child,.mx td:first-child{text-align:left; position:sticky; left:0; background:var(--surface); z-index:2; min-width:220px; max-width:360px}
.mx th:first-child{background:var(--surface2); z-index:3}
.mx th small{display:block; font-weight:400; color:var(--ink3)}
.mx th.cur,.mx td.cur{background:var(--accent-soft)}
.mx tr.grp td{background:var(--surface2); font-weight:700; color:var(--ink2); font-size:12px}
.mx td.c{text-align:center}
.mx .sub{padding-left:22px; color:var(--ink2)}
.cm{display:inline-flex; border:1px solid var(--rule); border-radius:6px; overflow:hidden}
.cm button{width:28px; height:26px; font-size:11px; font-weight:800; color:var(--ink3)}
.cm button+button{border-left:1px solid var(--rule)}
.cm button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.ck{width:28px; height:26px; border-radius:6px; border:1px solid var(--rule); font-weight:800; color:var(--ink3); display:inline-grid; place-items:center}
.ck[aria-pressed="true"]{background:var(--ok); color:#fff; border-color:var(--ok)}
.ck.sug{background:var(--warn-soft); color:var(--warn); border:1px dashed var(--warn)}
.mx td.tot,.mx th.tot{font-weight:800; color:var(--ink2)}
.bars{display:grid; gap:6px}
.bar{display:grid; grid-template-columns:44px 1fr 44px 44px; gap:10px; align-items:center; font-size:12.5px}
.bar .dv{font-size:11.5px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums}
.bar b{font-weight:800}
.bar .tr{height:10px; border-radius:5px; background:var(--rule2); overflow:hidden}
.bar .tr i{display:block; height:100%; background:var(--accent); border-radius:5px}
.bar .tr i.low{background:var(--warn)}
.bar .v{text-align:right; color:var(--ink2); font-variant-numeric:tabular-nums}
.itemlist{list-style:none; margin:6px 0 0; padding:0}
.itemlist li{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--rule2)}
.itemlist li .t{font-weight:700} .itemlist li .d{color:var(--ink2); font-size:12.5px}
.itemlist li > .btn, .itemlist li > .row{justify-self:start}
.itemlist li.editing{grid-template-columns:auto 1fr auto}
.itemlist li .row{gap:6px; flex-wrap:nowrap}
.crits{display:inline-flex; gap:3px}
.crits span{width:20px; height:20px; border-radius:5px; display:inline-grid; place-items:center; font-size:11px; font-weight:800; border:1px solid var(--rule); color:var(--ink3)}
.crits span.on{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.critbtn{display:inline-flex; gap:3px}
.critbtn button{width:22px; height:22px; border-radius:5px; font-size:11px; font-weight:800; border:1px solid var(--rule); color:var(--ink3)}
.critbtn button[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.cover-c{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-top:8px}
.cover-c div{padding:10px; border-radius:9px; border:1px solid var(--rule); text-align:center}
.cover-c div b{display:block; font-size:20px; font-weight:800}
.cover-c div span{font-size:11.5px; color:var(--ink3)}
.cover-c div.ok{border-color:var(--ok); background:var(--ok-soft)} .cover-c div.ok b{color:var(--ok)}
.cover-c div.due{border-color:var(--due); background:var(--due-soft)} .cover-c div.due b{color:var(--due)}
.pfgrid th:nth-child(2),.pfgrid td:nth-child(2){border-left:1px solid var(--rule)}
.pfgrid td:nth-child(4),.pfgrid th:nth-child(4){border-left:1px solid var(--rule)}

@media (max-width:1100px){ .menu{grid-template-columns:repeat(2,1fr)} .hero{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,1fr)} }
@media (max-width:900px){
  .strip{padding:0 12px; position:static; box-shadow:none}
  .strip::before{margin:0 -12px}
  .brand .ttl span{display:none}
  .strip-row{gap:10px}
  .timeline{margin-left:0; width:100%; overflow-x:auto; padding-bottom:2px}
  .store{margin-left:auto}
  .main{padding:12px 10px 40px}
  .plan{grid-template-columns:1fr}
  .list{position:static; max-height:none}
  .plan.show-detail .list{display:none}
  .plan:not(.show-detail) .detail{display:none}
  .back{display:inline-flex}
  .filters{position:static}
  .two{grid-template-columns:1fr}
  .mx th:first-child,.mx td:first-child{min-width:150px}
  .cover-c{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:600px){ .menu{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,1fr)} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }

/* ===== Navegación por pestañas e inicio de una pantalla ===== */
.topnav{display:flex; gap:2px; border-top:1px solid var(--rule2); margin:0 -20px; padding:0 20px; overflow-x:auto; scrollbar-width:none}
.topnav button{padding:6px 12px 7px; font-size:13.5px; font-weight:700; color:var(--ink2); border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap}
.topnav button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--brand)}
.topnav .n{display:inline-block; min-width:18px; padding:0 5px; border-radius:9px; background:var(--due-soft); color:var(--due); font-size:11px; font-weight:800; margin-left:5px; line-height:18px}
.band{display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin:0 0 14px}
.band.tight{margin:10px 0 0; grid-template-columns:repeat(4,1fr)}
.bk{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:10px 12px; display:flex; flex-direction:column}
.bk b{font-size:24px; font-weight:800; line-height:1.05; letter-spacing:-.02em} .bk span{font-size:11.5px; color:var(--ink3); margin-top:2px}
.bk.due b{color:var(--due)} .bk.ok b{color:var(--ok)} .bk.warn b{color:var(--warn)}
.bk.ring{flex-direction:row; align-items:center; gap:10px} .bk.ring svg{width:40px; height:40px; flex:none} .bk.ring div{display:flex; flex-direction:column} .bk.ring b{font-size:18px}
.grid2{display:grid; grid-template-columns:1.25fr 1fr; gap:14px}
.todo{list-style:none; margin:8px 0 0; padding:0}
.todo li{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; padding:6px 0; border-top:1px solid var(--rule2); font-size:13px}
.todo li em{font-style:normal; color:var(--ink3); font-size:11.5px; text-align:right}
.todo li.none,.al li.none{color:var(--ink3); border:0; display:block}
.al.compact li{padding:6px 10px} .al.compact li b{font-size:12.5px}
.card.ind{margin-top:14px}
.secrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.secrow .sec{display:inline-flex; align-items:center; gap:8px; padding:8px 12px 8px 8px; border:1px solid var(--rule); border-radius:999px; background:var(--surface); font-weight:700; font-size:13px; color:var(--ink)}
.secrow .sec .ic{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:#fff} .secrow .sec .ic svg{width:13px; height:13px}
.secrow .sec:hover{border-color:var(--ink3)}
.menu.compact{grid-template-columns:repeat(4,1fr); margin-top:4px}
.menu.compact .tile{min-height:0; padding:12px 14px; gap:6px}
.menu.compact .tile .ic{width:30px; height:30px; border-radius:8px} .menu.compact .tile .ic svg{width:16px; height:16px}
.menu.compact .tile h3{font-size:13.5px} .menu.compact .tile p{font-size:12px} .menu.compact .tile .st{font-size:12px; margin-top:4px}
@media (max-width:1100px){ .band{grid-template-columns:repeat(3,1fr)} .band.tight{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} .menu.compact{grid-template-columns:repeat(2,1fr)} }
@media (max-width:900px){ .topnav{margin:0 -12px; padding:0 12px} }
@media (max-width:600px){ .band{grid-template-columns:repeat(2,1fr)} }
</style>

he critical engine (if applicable) from V1 and before reaching V2 in the lowest CAT I visibility or in LVO meteorological (MET) conditions.", "outcome": ""}, {"key": "1|MT|Failure of one engine on take-off", "name": "Failure of one engine on take-off", "sec": 1, "ph": "MT", "freq": "B", "desc": "Failure of one engine from V1 and before reaching V2 in the lowest CAT I visibility or in LVO MET conditions.", "outcome": ""}, {"key": "1|MT|Emergency descent", "name": "Emergency descent", "sec": 1, "ph": "MT", "freq": "C", "desc": "Initiation of emergency descent from normal cruise altitude", "outcome": ""}, {"key": "1|MT|Engine-out approach & landing", "name": "Engine-out approach & landing", "sec": 1, "ph": "MT", "freq": "B", "desc": "With the critical engine (if applicable) failed, normal landing", "outcome": ""}, {"key": "1|MT|Engine-out approach & go-around", "name": "Engine-out approach & go-around", "sec": 1, "ph": "MT", "freq": "B", "desc": "With the critical engine (if applicable) failed, manually flown normal precision approach to DA, followed by a manual go-around — the whole manoeuvre to be flown without visual reference", "outcome": ""}, {"key": "1|MT|Go-around", "name": "Go-around", "sec": 1, "ph": "MT", "freq": "A", "desc": "Go-around, all engines operative", "outcome": ""}, {"key": "1|MT|Pilot qualification to operate in either pilot’s seat", "name": "Pilot qualification to operate in either pilot’s seat", "sec": 1, "ph": "MT", "freq": "B", "desc": "As per ORO.FC.235", "outcome": ""}, {"key": "2|MT|Approach type A or B", "name": "Approach type A or B", "sec": 2, "ph": "MT", "freq": "B", "desc": "Approach type A or B flight method 3D", "outcome": "See equivalency of approaches relevant to operations that place an additional demand on a proficient crew"}, {"key": "2|MT|Approach type A", "name": "Approach type A", "sec": 2, "ph": "MT", "freq": "B", "desc": "Approach type A flight method 2D", "outcome": "See equivalency of approaches relevant to operations that place an additional demand on a proficient crew"}, {"key": "2|EVAL or SBT|Approach type A", "name": "Approach type A", "sec": 2, "ph": "EVAL or SBT", "freq": "B", "desc": "Approach type A flight method 3D or 2D", "outcome": "See equivalency of approaches relevant to operations that place an additional demand on a proficient crew"}, {"key": "2|EVAL or SBT|Approach type B", "name": "Approach type B", "sec": 2, "ph": "EVAL or SBT", "freq": "B", "desc": "Approach type B flight method 3D", "outcome": "See equivalency of approaches relevant to operations that place an additional demand on a proficient crew"}, {"key": "3|MT|SPA approach(es)", "name": "SPA approach(es)", "sec": 3, "ph": "MT", "freq": "B", "desc": "Approach requiring specific approval", "outcome": "See equivalency of approaches relevant to operations — specific approval"}, {"key": "3|EVAL or SBT|SPA approach(es)", "name": "SPA approach(es)", "sec": 3, "ph": "EVAL or SBT", "freq": "B", "desc": "Approach requiring specific approval", "outcome": "See equivalency of approaches relevant to operations — specific approval"}, {"key": "3|EVAL, MT or SBT|SPA rejected takeoff (RTO)", "name": "SPA rejected takeoff (RTO)", "sec": 3, "ph": "EVAL, MT or SBT", "freq": "B", "desc": "Engine failure after the application of take-off thrust and before reaching V1 (in low-visibility MET conditions, preferably in the lowest approved visibility) Low-visibility RTO is not required under Part SPA but instead in Appendix 9 Section 6. Note: AMC1 SPA.LVO.120 point (f) does not require a low-visibility RTO. RTO is required only in the initial LVO course (point (g)(1)(iii) of AMC1 SPA.LVO.120).", "outcome": "Demonstrate manual aircraft control skills with smoothness and accuracy as appropriate to the situation. Detect deviations through instrument scanning. Maintain spare mental capacity during manual aircraft control. Maintain the aircraft within the flight envelope."}, {"key": "3|EVAL, MT or SBT|LVTO", "name": "LVTO", "sec": 3, "ph": "EVAL, MT or SBT", "freq": "B", "desc": "Notwithstanding AMC1 SPA.LVO120 point (f)(1) AMC1 SPA.LVO.120 requires SPA manoeuvres in the frequency of the OPC, as OPC is substituted in the EBT programme. Thus, the frequency in EBT is determined in every cycle (B). Low-visibility take-off, preferably in the lowest approved visibility.", "outcome": "Apply knowledge of the relationship between aircraft attitude, speed and thrust."}, {"key": "4|EVAL or SBT|Adverse Weather", "name": "Adverse Weather", "sec": 4, "ph": "EVAL or SBT", "freq": "A", "desc": "Thunderstorm, heavy rain, turbulence, ice build-up to include de-icing issues, as well as high-temperature conditions. The proper use of anti-ice and de-icing systems should be included generally in appropriate scenarios.", "outcome": "Anticipate adverse weather. Prepare for suspected adverse weather. Recognise adverse weather. Take appropriate action. Apply the appropriate procedure correctly. Assure aircraft control."}, {"key": "4|EVAL or SBT|Automation management", "name": "Automation management", "sec": 4, "ph": "EVAL or SBT", "freq": "A", "desc": "The purpose of this topic is to encourage and develop effective flight path management through proficient and appropriate use of the flight management system(s), guidance and automation, including transitions between modes, monitoring, mode awareness, vigilance and flexibility needed to change from one mode to another. The means of mitigating errors are included in this topic. The errors are described as mishandled auto flight systems, inappropriate mode selection, mishandled flight management system(s) and inappropriate autopilot usage.", "outcome": "Know how and when to use the flight management system(s), guidance and automation. Demonstrate correct methods for engagement and disengagement of the auto flight system(s). Demonstrate appropriate use of flight guidance, auto thrust and other automation systems. Maintain mode awareness of the auto flight system(s), including engagement and automatic transitions. Revert to different modes when appropriate. Detect deviations from the desired aircraft state (flight path, speed, attitude, thrust, etc.) and take appropriate action. Anticipate mishandled auto flight system. Recognise mishandled auto flight system. Take appropriate action if necessary."}, {"key": "4|EVAL or SBT|Competencies —nontechnical (CRM)", "name": "Competencies —nontechnical (CRM)", "sec": 4, "ph": "EVAL or SBT", "freq": "A", "desc": "This encapsulates the general CRM principles and objectives. It includes communication; leadership and teamwork; problem-solving and decisionmaking; situation awareness and management of information; and workload management. Emphasis should be placed on the development of leadership, shown by EBT data sources to be a highly effective competency in mitigating risk and improving safety through pilot performance.", "outcome": "Exposure to an event or sequence of events to allow the pilot to build awareness of human factors in aviation and the human limitations. This includes the development of the following competencies: Communication: Demonstrate: — effective use of language; — responsiveness to feedback; and — capability to state the plans and resolve ambiguities. Leadership and teamwork: Use appropriate authority to ensure focus on the task. Support others in completing tasks. Problem-solving and decisionmaking: Detect deviations from the desired state, evaluate problems, identify the risk, consider alternatives and select the best course of action. Continuously review progress and adjust plans. Situation awareness and management of information: Have an awareness of the aircraft state in its environment; project and anticipate changes. Workload management: Prioritise, delegate and receive assistance to maximise focus on the task. Continuously monitor the flight progress."}, {"key": "4|EVAL or SBT|Compliance", "name": "Compliance", "sec": 4, "ph": "EVAL or SBT", "freq": "A", "desc": "Compliance failure. Consequences of not complying with operating instructions (e.g. SOPs). This is not intended to list example scenario elements, but instructors should ensure that observed non-compliances are taken as learning opportunities throughout the programme. In all modules of the programme, the FSTD should as far as possible be treated like an aircraft, and non-compliances should not be accepted simply for expediency.", "outcome": "Recognise that a compliance failure has occurred. Make a verbal announcement. Take appropriate action if necessary. Restore safe flight path if necessary. Manage consequences."}, {"key": "4|EVAL or SBT|Go-around management", "name": "Go-around management", "sec": 4, "ph": "EVAL or SBT", "freq": "A", "desc": "Any threat or error that can result in circumstances that require a decision to perform a go-around, in addition to the execution of the go-around. Go-around scenarios should be fully developed to encourage effective leadership and teamwork, in addition to problem-solving and decision-making, plus execution using manual aircraft control or the flight management system(s) and automation as applicable. Design should include the element of surprise, and scenario-based go-arounds should not be predictable and anticipated. This topic is completely distinct from the go-around manoeuvre listed in the MT section that is intended only to practise psychomotor skills and a simple application of the procedures.", "outcome": ""}, {"key": "4|EVAL or SBT|Manual aircraft control", "name": "Manual aircraft control", "sec": 4, "ph": "EVAL or SBT", "freq": "A", "desc": "Controls the flight path through manual control", "outcome": "Demonstrate manual aircraft control skills with smoothness and accuracy as appropriate to the situation. Detect deviations through instrument scanning. Maintain spare mental capacity during manual aircraft control. Maintain the aircraft within the normal flight envelope. Apply knowledge of the relationship between aircraft attitude, speed and thrust."}, {"key": "4|EVAL or SBT|Monitoring, crosschecking, error management, mismanaged aircraft state", "name": "Monitoring, crosschecking, error management, mismanaged aircraft state", "sec": 4, "ph": "EVAL or SBT", "freq": "A", "desc": "The scenarios should be realistic and relevant, and should be used for the purpose of demonstration and reinforcement of effective monitoring. Modules in the FSTD should be treated like those in an aircraft so that trainees have the opportunity to develop the competency with the practice of the right techniques and attitudes related to these topics through pilot performance, and that instructors have the opportunity to assess and train these topics in a realistic environment. As shown by the EBT data report, these topics are of key importance to improve safety in operations. In addition, the operator may also use these topics to develop scripted roleplaying scenarios in the form of ISI. These scenarios cater for the need to monitor flight path excursions from the instructor pilot (PF), detect errors and make appropriate interventions, either verbally or by taking control as applicable. Demonstration scenarios may also be used. Demonstrated role -play should contain realistic and not gross errors, leading at times to a mismanaged aircraft state, which can also be combined with upset management training.", "outcome": "Recognise mismanaged aircraft state. Observe the pilot’s behaviour: how the pilot is mitigating errors, performing cross-checking, monitoring performance and dealing with a mismanaged aircraft state, in order to ensure that observed deviations, errors and mistakes are taken as learning opportunities throughout the programme. Monitor flight path excursions. Detect errors and threats through proper cross-checking performance. Make appropriate interventions either verbally or by taking control if applicable. Take appropriate action if necessary. Restore the desired aircraft state. Identify and manage consequences."}, {"key": "4|EVAL or SBT|Unstable approach", "name": "Unstable approach", "sec": 4, "ph": "EVAL or SBT", "freq": "A", "desc": "Reinforce stabilised approach philosophy and adherence to defined parameters. Encourage go-arounds when crews are outside these parameters. Develop and sustain competencies related to the management of high-energy situations.", "outcome": ""}, {"key": "5|EVAL, MT or SBT|Upset prevention training", "name": "Upset prevention training", "sec": 5, "ph": "EVAL, MT or SBT", "freq": "B", "desc": "Compliance with AMC1 or AMC2 to ORO.FC.220&230 Include upset prevention elements in Table 1 for the recurrent training programme in at least every cycle, such that all the elements are covered over a period not exceeding 3 years. The elements are numbered with letters from A to I in Table 1 of AMC1 ORO.FC.220&230. Each element is made up of several numbered components. According to the principles of EBT, covering one component should satisfy the requirement to cover the whole element of recognising and preventing the development of upset conditions.", "outcome": "Early recognition and prevention of upset conditions. When the differences between LHS and RHS are not significant in the handling of the aircraft, UPRT may be conducted in either seat."}, {"key": "6|EVAL or SBT|Adverse wind", "name": "Adverse wind", "sec": 6, "ph": "EVAL or SBT", "freq": "B", "desc": "Adverse wind/crosswind. This includes tailwind but not ATC misreporting of the actual wind.", "outcome": "Recognise adverse-wind conditions. Observe limitations. Apply the appropriate procedures. Maintain directional control and safe flight path."}, {"key": "6|EVAL or SBT|Aircraft system malfunctions, including operations under MEL", "name": "Aircraft system malfunctions, including operations under MEL", "sec": 6, "ph": "EVAL or SBT", "freq": "B", "desc": "Any internal failure(s) apparent or not apparent to the crew Any item cleared by the MEL but having an impact upon flight operations — for instance, thrust reverser locked. Malfunctions to be considered should have one or more of the following characteristics: — Immediacy — Complexity — Degradation of aircraft control — Loss of primary instrumentation — Management of consequences The operator should vary malfunctions for each characteristic over the EBT cycle. Unless specified otherwise in the operational suitability data, at least one malfunction with each characteristic should be included in every cycle. Combining characteristics should not reduce the number of malfunctions below seven in each cycle. For each crew member, the characteristics of degraded control and loss of instrumentation should be in the role of pilot flying and the others may be in the role of pilot flying or pilot monitoring. For full details, see the malfunction equivalency methodology.", "outcome": "Recognise system malfunction. Take appropriate action including correct stop/go decision. Apply the appropriate procedure correctly. Maintain aircraft control. Manage consequences. Apply crew operating procedures where necessary. Respond appropriately to additional system abnormalities associated with MEL dispatch."}, {"key": "6|EVAL or SBT|Aircraft system management", "name": "Aircraft system management", "sec": 6, "ph": "EVAL or SBT", "freq": "B", "desc": "Normal system operation according to defined instructions", "outcome": "This is not considered as a standalone topic. It is linked with the topic ‘compliance’. Where a system is not managed according to normal or defined procedures, this is determined as a non-compliance."}, {"key": "6|EVAL or SBT|Approach, visibility close to minimum", "name": "Approach, visibility close to minimum", "sec": 6, "ph": "EVAL or SBT", "freq": "B", "desc": "Any situation where visibility becomes a threat", "outcome": "Recognise actual conditions. Observe aircraft and/or procedural limitations. Apply the appropriate procedures if applicable. Maintain directional control and safe flight path."}, {"key": "6|EVAL or SBT|Landing", "name": "Landing", "sec": 6, "ph": "EVAL or SBT", "freq": "B", "desc": "Pilots should have opportunities to practise landings in demanding situations at the defined frequency. Data indicates that landing problems have their roots in a variety of factors, including inappropriate decisionmaking, in addition to manual aircraft control skills if difficult environmental conditions exist. The purpose of this item is to ensure that pilots are exposed to this during the programme.", "outcome": "Landing in demanding environmental conditions, with malfunctions as appropriate"}, {"key": "6|EVAL or SBT|Runway or taxiway condition", "name": "Runway or taxiway condition", "sec": 6, "ph": "EVAL or SBT", "freq": "B", "desc": "Contamination or surface quality of the runway, taxiway, or tarmac including foreign objects", "outcome": "Recognise hazardous runway condition. Observe limitations. Take appropriate action. Apply the appropriate procedures correctly. Assure aircraft control."}, {"key": "6|EVAL or SBT|Surprise", "name": "Surprise", "sec": 6, "ph": "EVAL or SBT", "freq": "B", "desc": "The data analysed during the development of the EBT concept indicated substantial difficulties encountered by crews when faced with a threat or error, which was a surprise or an unexpected event. The element of surprise should be distinguished from what is sometimes referred to as the ‘startle factor’ — the latter being a physiological reaction. Wherever possible, consideration should be given towards variations in the types of scenario, times of occurrences and types of occurrence, so that pilots do not become overly familiar with repetitions of the same scenarios. Variations should be the focus of EBT programme design, and not left to the discretion of individual instructors, in order to preserve programme integrity and fairness.", "outcome": "Exposure to an unexpected event or sequence of events at the defined frequency in order to build resilience."}, {"key": "6|EVAL or SBT|Terrain", "name": "Terrain", "sec": 6, "ph": "EVAL or SBT", "freq": "B", "desc": "Alert, warning, or conflict", "outcome": "Anticipate terrain threats. Prepare for terrain threats. Recognise unsafe terrain clearance. Take appropriate action. Apply the appropriate procedures correctly. Maintain aircraft control. Restore safe flight path. Manage consequences."}, {"key": "6|EVAL or SBT|Workload, distraction, pressure, stress", "name": "Workload, distraction, pressure, stress", "sec": 6, "ph": "EVAL or SBT", "freq": "B", "desc": "This is not considered a topic for specific attention on its own, but more as a reminder to programme developers to ensure that pilots are exposed to immersive training scenarios which expose them to manageable high workload and distractions during the course of the EBT programme, at the defined frequency.", "outcome": "Manage available resources efficiently to prioritise and perform tasks in a timely manner under all circumstances"}, {"key": "7|EVAL or SBT|Upset recovery", "name": "Upset recovery", "sec": 7, "ph": "EVAL or SBT", "freq": "C", "desc": "Compliance with AMC1 or AMC2 to ORO.FC.220&230 Include the recovery exercises in Table 2 of AMC1 ORO.FC.220&30 for the recurrent training programme, such that all the exercises are covered over a period not exceeding 3 years. According to the principles of EBT, covering one component should satisfy the requirement to cover the whole element of recovery from developed upsets. The same principles apply to the exercises of components 2, 3 and 4 where one exercise may satisfy the requirement to cover the whole component. An aeroplane upset is defined as an undesired aeroplane state in flight characterised by unintentional divergences from parameters normally experienced during line operations or training. An aeroplane upset may involve pitch and/or bank angle divergences as well as inappropriate airspeeds for the conditions.", "outcome": "Recognise upset condition. Make timely and appropriate intervention. Take appropriate action. Assure timely and appropriate intervention. (AMC1 ORO.FC.220&230 Table 2 component 1) Assure aircraft control. Maintain or restore a safe flight path. Assess consequential issues. Manage outcomes. Consolidate the summary of aeroplane recovery techniques. (AMC1 ORO.FC.220&230 Table 2 component 5) Note: The operator should assess if the exercises should be practised for the either seat qualification."}, {"key": "8|EVAL or SBT|ATC", "name": "ATC", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "ATC error. Omission, miscommunication, garbled, poor quality transmission. All these act as distractions to be managed by the crew. The scenarios should be combined, where possible, with others of the same or higher weighting, the principal reason being to create distractions.", "outcome": "Respond to communications appropriately. Recognise, clarify and resolve any ambiguities. Refuse or question unsafe instructions. Use standard phraseology whenever possible."}, {"key": "8|EVAL or SBT|Engine failure", "name": "Engine failure", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "Any engine failure or malfunction, which causes loss or degradation of thrust that affects performance. This is distinct from the engine-out manoeuvres described in the MT section above, which are intended only to practise psychomotor skills and reinforce procedures to manage engine failures.", "outcome": "Recognise engine failure. Take appropriate action. Apply the appropriate procedure correctly. Maintain aircraft control. Manage consequences."}, {"key": "8|EVAL or SBT|Fire and smoke management", "name": "Fire and smoke management", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "This includes engine, electric, pneumatic, cargo fire, smoke or fumes.", "outcome": "Recognise fire, smoke or fumes Take appropriate action. Apply the appropriate procedure correctly. Maintain aircraft control. Manage consequences."}, {"key": "8|EVAL or SBT|Loss of communications", "name": "Loss of communications", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "Lost or difficult communications due to either pilot mis-selection or a failure external to the aircraft. This could be for a few seconds or a total loss.", "outcome": "Recognise loss of communications. Take appropriate action. Execute the appropriate procedure as applicable. Use alternative ways to communicate. Manage consequences."}, {"key": "8|EVAL or SBT|Managing loading, fuel, performance errors", "name": "Managing loading, fuel, performance errors", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "A calculation error by one or more pilots, or someone involved with the process, or the process itself, e.g. incorrect information on the load sheet", "outcome": "Anticipate the potential for errors in load/fuel/performance data. Recognise inconsistencies. Manage/avoid distractions. Make changes to paperwork/aircraft system(s) to eliminate error. Identify and manage consequences."}, {"key": "8|EVAL or SBT|Navigation", "name": "Navigation", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "External NAV failure. Loss of GPS satellite, ANP exceeding RNP, loss of external NAV source(s)", "outcome": "Recognise a NAV degradation. Take appropriate action. Execute the appropriate procedure as applicable. Use alternative NAV guidance. Manage consequences."}, {"key": "8|EVAL or SBT|Operations- or type-specific", "name": "Operations- or type-specific", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "Intentionally blank", "outcome": "Intentionally blank"}, {"key": "8|EVAL or SBT|Operations of special airport approval", "name": "Operations of special airport approval", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "See equivalency of approaches relevant to operations.", "outcome": "The operator should comply with the national qualification requirements published in the aeronautical information publication (AIP)."}, {"key": "8|EVAL or SBT|Pilot incapacitation", "name": "Pilot incapacitation", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "Consequences for the nonincapacitated pilot", "outcome": "Recognise incapacitation. Take appropriate action including correct stop/go decision. Apply the appropriate procedure correctly. Maintain aircraft control. Manage consequences."}, {"key": "8|EVAL or SBT|Traffic", "name": "Traffic", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "Traffic conflict. ACAS RA or TA, or visual observation of conflict, which requires evasive manoeuvring", "outcome": "Anticipate potential loss of separation. Recognise loss of separation. Take appropriate action. Apply the appropriate procedure correctly. Maintain aircraft control. Manage consequences."}, {"key": "8|EVAL or SBT|Wind shear recovery", "name": "Wind shear recovery", "sec": 8, "ph": "EVAL or SBT", "freq": "C", "desc": "With or without warnings including predictive. A wind shear scenario is ideally combined with an adverseweather scenario containing other elements.", "outcome": "Anticipate potential for wind shear. Avoid known wind shear or prepare for suspected wind shear. Recognise wind shear encounter. Take appropriate action. Apply the appropriate procedure correctly. Assure aircraft control. Recognise out of wind shear condition. Maintain or restore a safe flight path. Assess consequential issues and manage outcomes."}], "exercises": [{"id": "J1", "topic": "1|MT|Rejected take-off", "sec": 1, "ph": "MT", "freq": "B", "phases": ["TO"], "gm": "From initiation of take-off to complete stop (or as applicable to the procedure)", "comp": ["APK", "FPM"]}, {"id": "J2", "topic": "1|MT|Failure of the critical engine between V1 and V2", "sec": 1, "ph": "MT", "freq": "B", "phases": ["TO"], "gm": "The manoeuvre is complete at a point when the aircraft is stabilised at normal engine-out climb speed with the correct pitch and lateral control, in trim condition and, as applicable, autopilot engagement. Only one failure of the critical engine between V1 and V2 a year may be done in LVO conditions.", "comp": ["APK", "FPM"]}, {"id": "J3", "topic": "1|MT|Failure of one engine on take-off", "sec": 1, "ph": "MT", "freq": "B", "phases": ["TO"], "gm": "The manoeuvre is complete at a point when the aircraft is stabilised in a clean configuration with engine-out procedures completed. Only one failure of the critical engine between V1 and V2 a year may be done in LVO conditions.", "comp": ["APK", "FPM"]}, {"id": "J4", "topic": "1|MT|Failure of one engine on take-off", "sec": 1, "ph": "MT", "freq": "B", "phases": ["TO"], "gm": "The manoeuvre is complete at a point when the aircraft is stabilised in a clean configuration with engine-out procedures completed.", "comp": ["APK", "FPA", "FPM"]}, {"id": "J5", "topic": "1|MT|Emergency descent", "sec": 1, "ph": "MT", "freq": "C", "phases": ["CRZ"], "gm": "The manoeuvre is complete once the aircraft is stabilised in emergency descent configuration (and profile). However, if the EBT programme does not include the example scenario element ‘emergency descent’ in the training topic ‘automation management’, the emergency descent procedures should be completed and should not stop once the aircraft is stabilised in emergency descent configuration.", "comp": ["APK", "FPA", "FPM"]}, {"id": "J6", "topic": "1|MT|Engine-out approach & landing", "sec": 1, "ph": "MT", "freq": "B", "phases": ["LDG"], "gm": "Initiation in a stabilised engine-out configuration from not less than 3 NM final approach, until completion of roll-out", "comp": ["APK", "FPM"]}, {"id": "J7", "topic": "1|MT|Engine-out approach & go-around", "sec": 1, "ph": "MT", "freq": "B", "phases": ["APP"], "gm": "This manoeuvre should be flown from intercept to centreline until acceleration after goaround. The manoeuvre is complete at a point when the aircraft is stabilised at normal engine-out climb speed with the correct pitch and lateral control, in trim condition and, as applicable, autopilot engagement (describe generally the critical part of the manoeuvre).", "comp": ["APK", "FPM"]}, {"id": "J8", "topic": "1|MT|Go-around", "sec": 1, "ph": "MT", "freq": "A", "phases": ["APP"], "gm": "High energy, initiation during the approach at 150 to 300 m (500 to 1 000 ft) below the missed approach level-off altitude", "comp": ["APK", "FPA", "FPM"]}, {"id": "J9", "topic": "1|MT|Go-around", "sec": 1, "ph": "MT", "freq": "A", "phases": ["APP"], "gm": "Initiation of a go-around from DA followed by visual circuit and landing", "comp": ["APK", "FPA", "FPM"]}, {"id": "J10", "topic": "1|MT|Go-around", "sec": 1, "ph": "MT", "freq": "A", "phases": ["APP"], "gm": "During flare/rejected landing", "comp": ["APK", "FPA", "FPM"]}, {"id": "J11", "topic": "1|MT|Pilot qualification to operate in either pilot’s seat", "sec": 1, "ph": "MT", "freq": "B", "phases": ["APP"], "gm": "Complete the manoeuvres mandated in ORO.FC.235.", "comp": []}, {"id": "J12", "topic": "2|MT|Approach type A or B", "sec": 2, "ph": "MT", "freq": "B", "phases": ["APP"], "gm": "See equivalency of approaches relevant to operations", "comp": ["APK", "FPA", "FPM", "SAW", "KNO"]}, {"id": "J13", "topic": "2|MT|Approach type A", "sec": 2, "ph": "MT", "freq": "B", "phases": ["APP"], "gm": "See equivalency of approaches relevant to operations", "comp": ["APK", "FPA", "FPM", "SAW", "KNO"]}, {"id": "J14", "topic": "2|EVAL or SBT|Approach type A", "sec": 2, "ph": "EVAL or SBT", "freq": "B", "phases": ["APP"], "gm": "See equivalency of approaches relevant to operations", "comp": ["APK", "FPA", "FPM", "SAW", "KNO"]}, {"id": "J15", "topic": "2|EVAL or SBT|Approach type B", "sec": 2, "ph": "EVAL or SBT", "freq": "B", "phases": ["APP"], "gm": "See equivalency of approaches relevant to operations", "comp": ["APK", "FPA", "FPM", "SAW", "KNO"]}, {"id": "J16", "topic": "3|MT|SPA approach(es)", "sec": 3, "ph": "MT", "freq": "B", "phases": ["APP"], "gm": "Approaches flown from FAF to landing or go-around", "comp": ["APK", "FPA", "FPM"]}, {"id": "J17", "topic": "3|EVAL or S function syncGuide(f, m) {

let PERF_M = 'P2';
let SUG_FDA = null;
function perfChart() {
  const P = D.perf.values; const isP2 = PERF_M === 'P2';
  if (!isP2 && PERF_M < 2) PERF_M = 2;
  const k = isP2 ? null : PERF_M - 1;
  const val = c => { if (!isP2) return P[c][k]; const v = parseFloat((S.perf2 || {})[c]); return isFinite(v) ? v : P[c][0]; };
  const vals = COMP.map(val); const min = Math.min(...vals), max = Math.max(...vals);
  const order = [...COMP].sort((a, b) => val(a) - val(b)); const low = order.slice(0, 4);
  const lbl = isP2 ? 'M1 P2' : 'M' + PERF_M;
  return `<div class="row" style="margin-top:8px;gap:5px">${MODULES.filter(x => x.m >= 2).map(x => `<button class="chip" data-act="perfM" data-v="${x.m}" aria-pressed="${PERF_M === x.m}">M${x.m}</button>`).join('')}<button class="chip" data-act="perfM" data-v="P2" aria-pressed="${isP2}">M1 P2</button><span class="hint" style="margin-left:6px">Promedio del módulo elegido, ordenado de menor a mayor.</span></div>
  <div class="bars" style="margin-top:12px">${order.map(c => { const v = val(c), est = isP2 ? false : (D.perf.estimated[c] || []).includes(PERF_M); const prev = isP2 ? P[c][5] : (k > 1 ? P[c][k - 1] : null); const d = prev === null ? null : +(v - prev).toFixed(2);
    return `<div class="bar"><b>${c}</b><div class="tr"><i class="${low.includes(c) ? 'low' : ''}" style="width:${Math.round(((v - min + 0.05) / (max - min + 0.05)) * 100)}%"></i></div><span class="v">${v.toFixed(2)}${est ? '*' : ''}</span>${d === null ? '<span class="dv"></span>' : `<span class="dv" style="color:${d < 0 ? 'var(--due)' : d > 0 ? 'var(--ok)' : 'var(--ink3)'}">${d > 0 ? '+' : ''}${d.toFixed(2)}</span>`}</div>`; }).join('')}</div>
  <p class="hint">Barras ámbar: las cuatro competencias con el promedio más bajo en ${lbl} (${low.join(', ')}). La columna de la derecha es la variación frente al módulo anterior${isP2 ? ' (M6 del periodo 1)' : ''}. Un asterisco marca un valor sin etiqueta en la gráfica original, estimado por la altura de la barra.</p>`;
}
function suggestTargets(m = S.module, f = S.fleet) {
  const P = D.perf.values; const t = S.target[f] || {};
  const fd = (S.data[f] || {})[m] || {}; const exComp = {}; COMP.forEach(c => { exComp[c] = 0; });
  Object.values(fd).forEach(en => en.ex.forEach(id => (EX[id] ? EX[id].comp : []).forEach(c => { exComp[c]++; })));
  const p2 = S.perf2 || {}; const p2v = c => { const v = parseFloat(p2[c]); return isFinite(v) ? v : null; };
  const eff = c => { const v = p2v(c); return v === null ? P[c][5] : v; };
  const byLast = [...COMP].sort((a, b) => eff(a) - eff(b));
  const bonus = f === 'A320' ? fdaCompBonus() : {};
  const upEvs = f === 'A320' ? fdaRanked().filter(r => r.st.trend === 'up') : [];
  const rows = COMP.map(c => {
    const v2 = p2v(c); const has2 = v2 !== null;
    const last = has2 ? v2 : P[c][5];
    const delta = has2 ? +(v2 - P[c][5]).toFixed(2) : null;
    const rank = byLast.indexOf(c) + 1;
    const before = (t[c] || []).filter(x => x < m).length;
    let score = 10 - rank; const why = [];
    why.push(has2 ? `promedio ${last.toFixed(2)} en M1 P2 (${rank === 1 ? 'el más bajo' : rank + 'º más bajo'})` : `promedio ${last.toFixed(2)} en M6 del periodo 1 (${rank === 1 ? 'el más bajo' : rank + 'º más bajo'})`);
    if (delta === null) { why.push('variación M6 → M1 P2 pendiente: carga el promedio del M1 P2'); }
    else if (delta < 0) { score += 3; why.push(`bajó ${Math.abs(delta).toFixed(2)} del M6 del periodo 1 al M1 P2`); } else if (delta === 0) { score += 1; why.push('sin cambio del M6 del periodo 1 al M1 P2'); } else why.push(`subió ${delta.toFixed(2)} del M6 del periodo 1 al M1 P2`);
    score -= 2 * before; why.push(before ? `ya trabajada en ${before} módulo${before > 1 ? 's' : ''} del ciclo` : 'aún no trabajada en el ciclo');
    if (exComp[c] >= 3) { score += 1; why.push(`${exComp[c]} ejercicios elegidos en M${m} la ejercitan`); }
    if (f === 'A320' && bonus[c]) { score += 2; why.push(`ligada a ${bonus[c]} evento${bonus[c] > 1 ? 's' : ''} FDA en aumento`); }
    return { c, score, why, last, delta, before, ex: exComp[c], fda: upEvs.filter(r2 => r2.ev.comps.includes(c)).map(r2 => r2.ev.name) };
  }).sort((a, b) => b.score - a.score || a.last - b.last);
  return rows;
}

  // UPRT: años del ciclo sin solape (M1–M2, M3–M4, M5–M6); la caja del año actual encierra sus dos columnas.

}
function yrCls(m, mode) {
  if (mode === 'uprt' || mode === 'rsmv') { const y = yearOf(S.module); const first = 2 * y - 1; if (m === first) return 'yr yrl'; if (m === first + 1) return 'yr yrr'; return ''; }

}

/* ===== 7. Eq. of malfunctions ===== */
function malfList(f = S.fleet, m) { return ((S.malf[f] || {})[m] || []); }
function malfAll(f = S.fleet) {
  // Unión: selección directa (sección 7) + fallas FCTS marcadas en el planificador
  const out = [];
  MODULES.forEach(x => {
    const seen = new Set();
    malfList(f, x.m).forEach(it => { const k = typeof it === 'string' ? it : 'c:' + it.n; if (!seen.has(k)) { seen.add(k); out.push({ m: x.m, it }); } });
    const fd = (S.data[f] || {})[x.m] || {};
    Object.values(fd).forEach(en => (en.fcts || []).forEach(id => { if (!seen.has(id)) { seen.add(id); out.push({ m: x.m, it: id, fromPlan: true }); } }));
  });
  return out;
}
function critOf(it) { return typeof it === 'string' ? (FC[it] ? FC[it].crit : []) : (it.c || []); }
function nameOf(it) { return typeof it === 'string' ? (FC[it] ? FC[it].sys + ': ' + FC[it].mal : it) : it.n; }
function malfCoverage(f = S.fleet) {
  const all = malfAll(f); const crit = {}; CRIT.forEach(k => { crit[k] = all.filter(x => critOf(x.it).includes(k)).length; });
  return { total: all.length, crit, all };
}
VIEWS.malf = function () {
  const cov = malfCoverage(); const cur = malfAll().filter(x => x.m === S.module);
  const fq = S.filters.fq.toLowerCase();
  const isA = S.fleet === 'A320';
  let picker = '';
  if (isA) {
    const bySys = {}; D.fcts.filter(x => !fq || (x.sys + ' ' + x.mal).toLowerCase().includes(fq)).forEach(x => { (bySys[x.sys] ||= []).push(x); });
    const selIds = new Set(cur.map(x => typeof x.it === 'string' ? x.it : ''));
    picker = `<div class="addrow"><input type="search" data-act="fq" value="${esc(S.filters.fq)}" placeholder="Buscar una falla por sistema o nombre" aria-label="Buscar falla"></div>
      <div style="margin-top:8px;border:1px solid var(--rule);border-radius:9px;overflow:hidden;max-height:520px;overflow-y:auto">${Object.keys(bySys).map(sys => { const list = bySys[sys]; const sel = list.filter(x => selIds.has(x.id)).length; const key = 'malf|' + sys; const open = key in OPEN ? OPEN[key] : (sel || fq);
        return `<details class="fcts-sys" data-key="${esc(key)}" ${open ? 'open' : ''}><summary><span>${esc(sys)}</span>${sel ? `<span class="sel">${sel} en M${S.module}</span>` : ''}<span class="n">${list.length}</span></summary>
          ${list.map(x => `<label class="fr ${selIds.has(x.id) ? 'on' : ''}"><input type="checkbox" data-act="malfPick" data-v="${x.id}" ${selIds.has(x.id) ? 'checked' : ''}><span>${esc(x.mal)}</span><span class="crits">${CRIT.map(k => `<span class="${x.crit.includes(k) ? 'on' : ''}">${k}</span>`).join('')}</span></label>`).join('')}</details>`; }).join('') || '<div class="empty" style="margin:0;border:0">Ninguna falla coincide con la búsqueda.</div>'}</div>`;
  }
  return `<div class="sec-head"><div><h1>Eq. of malfunctions</h1><p>Equivalencia de fallas del ciclo. La JET MATRIX pide al menos siete fallas en el ciclo y una por cada característica: inmediatez (I), pérdida de instrumentación (L), degradación del control (D), manejo de consecuencias (M) y complejidad (C). Las fallas marcadas en el planificador también cuentan.</p></div></div>
  <div class="card"><h2>Cobertura del ciclo<small>${S.fleet}</small></h2>
    <div class="cover-c"><div class="${cov.total >= 7 ? 'ok' : 'due'}"><b>${cov.total}</b><span>fallas en el ciclo (mín. 7)</span></div>${CRIT.map(k => `<div class="${cov.crit[k] ? 'ok' : 'due'}"><b>${cov.crit[k]}</b><span>${k}: ${CRIT_NAME[k]}</span></div>`).join('')}</div>
  </div>
  <div class="two" style="margin-top:14px">
    <div class="card"><h2>Fallas de ${modFull(S.module)}<small>${cur.length}</small></h2>
      ${cur.length ? `<ul class="itemlist">${cur.map((x, i) => `<li><span class="crits">${CRIT.map(k => `<span class="${critOf(x.it).includes(k) ? 'on' : ''}">${k}</span>`).join('')}</span><span><span class="t">${esc(nameOf(x.it))}</span>${x.fromPlan ? '<br><span class="hint" style="display:inline">Marcada en el planificador</span>' : ''}</span>${x.fromPlan ? '' : `<button class="btn sm danger" data-act="rmMalf" data-i="${malfList(S.fleet, S.module).findIndex(it => it === x.it)}">Quitar</button>`}</li>`).join('')}</ul>` : '<div class="empty">Sin fallas asignadas a este módulo.</div>'}

      <div class="addrow"><input type="text" id="mfName" placeholder="${isA ? 'Falla que no está en la lista FCTS' : 'Nombre de la falla (ej. ENG 1 FAIL, HYD L SYS PRESS)'}"><span class="critbtn" id="mfCrit">${CRIT.map(k => `<button type="button" data-act="mfCrit" data-k="${k}" aria-pressed="false" title="${CRIT_NAME[k]}">${k}</button>`).join('')}</span><button class="btn" data-act="addMalf">Agregar</button></div>
    </div>
    <div class="card"><h2>${isA ? 'Lista FCTS del A320' : 'Todas las fallas del ciclo'}<small>${isA ? D.fcts.length + ' fallas' : cov.total}</small></h2>
      ${isA ? picker : (cov.all.length ? `<ul class="itemlist">${cov.all.map(x => `<li><span class="tag">M${x.m}</span><span class="t">${esc(nameOf(x.it))}</span><span class="crits">${CRIT.map(k => `<span class="${critOf(x.it).includes(k) ? 'on' : ''}">${k}</span>`).join('')}</span></li>`).join('')}</ul>` : '<div class="empty">Todavía no hay fallas en el ciclo para esta flota.</div>')}
    </div>

/* ===== 8. PF duty ===== */
function pfTotals(f = S.fleet, m = S.module) {
  const t = { CM1TO: 0, CM1LDG: 0, CM2TO: 0, CM2LDG: 0 };
  D.pf.forEach(p => { const v = ((S.pf[f] || {})[m] || {})[p.id] || { CM1: [], CM2: [] }; ['CM1', 'CM2'].forEach(c => v[c].forEach(k => { t[c + k]++; })); });
  return t;
}

  return `<div class="card sigcard" data-role="${r.id}">

        <div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="sigSave" data-key="${key}">Guardar firma</button><button class="btn sm" data-act="sigReset" data-key="${key}">Limpiar</button><label class="btn sm">Subir imagen<input type="file" accept="image/*" data-act="sigUpload" data-key="${key}" style="display:none"></label></div>

function lpcWindowGaps(f = S.fleet, m = S.module) {

  const out = []; const st = S.rsmv[f] || {};
  D.rsmv.filter(r => !r.sub && r.id !== 'R7').forEach(r => {
    const plan = st[r.id] || {}; const everPlanned = MODULES.some(x => (plan[x.m] || []).length); if (!everPlanned) return;
    ['CM1', 'CM2'].forEach(cm => { for (let y = 1; 2 * y <= m; y++) { const a = 2 * y - 1, b = 2 * y; const ok = (plan[a] || []).includes(cm) || (plan[b] || []).includes(cm); if (!ok) out.push({ name: r.name, cm, pair: 'año ' + y + ' (M' + a + '–M' + b + ')' }); } });
  });

}

  if (every.length) push('due', `${every.length} elemento${every.length > 1 ? 's' : ''} de cada módulo sin incluir en M${m}`, every.map(e => e.name).join(', '), 'plan');
  // Frecuencia B en el año
  const y = yearOf(m); const bPend = els.filter(e => e.cat === 'B' && !isEvery(e, f) && !seenIn(e.id, f).some(x => yearOf(x) === y));
  if (bPend.length) push(m % 2 === 0 ? 'due' : 'warn', `${bPend.length} elemento${bPend.length > 1 ? 's' : ''} B sin cubrir en el año ${y}`, (m % 2 === 0 ? 'Obligatorios en M' + m + ': ' : 'Pendientes; queda M' + (m + 1) + ' además de M' + m + ': ') + bPend.map(e => e.name).join(', '), 'plan');
  // Frecuencia C en el ciclo
  const cPend = els.filter(e => e.cat === 'C' && !isEvery(e, f) && !seenIn(e.id, f).length);
  if (cPend.length) push(remaining <= 1 ? 'due' : remaining <= 3 ? 'warn' : 'info', `${cPend.length} elemento${cPend.length > 1 ? 's' : ''} C sin fecha en el ciclo`, `Quedan ${remaining} módulo${remaining !== 1 ? 's' : ''} después de M${m}: ${cPend.map(e => e.name).join(', ')}`, 'plan');
  // Fallas: características y mínimo
  const cov = malfCoverage(f); const miss = CRIT.filter(k => !cov.crit[k]);
  if (miss.length || cov.total < 7) push(remaining <= 1 ? 'due' : 'warn', 'Equivalencia de fallas incompleta', (miss.length ? 'Sin cubrir: ' + miss.map(k => k + ' (' + CRIT_NAME[k] + ')').join(', ') + '. ' : '') + (cov.total < 7 ? `${cov.total} fallas en el ciclo, mínimo 7.` : ''), 'malf');
  // Ventana LPC de 12 meses
  const gaps = lpcWindowGaps(f, m);
  if (gaps.length) push('due', `${gaps.length} vacío${gaps.length > 1 ? 's' : ''} anual${gaps.length > 1 ? 'es' : ''} en maniobras LPC`, gaps.slice(0, 6).map(g => `${g.cm} sin ${g.name} en el ${g.pair}`).join('; ') + (gaps.length > 6 ? '; y ' + (gaps.length - 6) + ' más' : ''), 'rsmv');
  // Boletín Safety FDA: eventos en aumento cuyo foco aún no está en el módulo

  else if (oneDown.length) push('info', 'Competencias que bajaron en M6 del periodo 1', oneDown.map(c => `${c} (${P[c][4].toFixed(2)} → ${P[c][5].toFixed(2)})`).join(', '), 'target');
  if (!targetsOf(m, f).length) push(suggestedOf(m, f).length ? 'warn' : 'due', `M${m} sin competencias target confirmadas`, suggestedOf(m, f).length ? 'Hay ' + suggestedOf(m, f).length + ' sugeridas por confirmar' : 'Aplica la sugerencia o marca la matriz', 'target');

  if (ataNone.length) push(remaining <= 1 ? 'due' : 'info', `${ataNone.length} sistema${ataNone.length > 1 ? 's' : ''} ATA sin cubrir en 36 meses`, ataNone.map(a => a.ata + ' ' + a.name).join(', '), 'systop');

function fdaApply(evId) {
  const ev = fdaData().events.find(e => e.id === evId); if (!ev) return 0;
  const m = S.module, fl = S.fleet; let n = 0;
  const els = ev.elements.filter(id => EL[id] && EL[id].fleets.includes(fl));
  els.forEach((id, i) => { const en = entry(id, m, fl, true); if (i === 0 && ev.custom && !en.custom.includes(ev.custom + ' (boletín FDA)')) { en.custom.push(ev.custom + ' (boletín FDA)'); n++; } if (!en.note) en.note = 'Foco del boletín Safety FDA: ' + ev.name + '.'; });
  ev.ex.filter(x => EX[x]).forEach(x => {
    // El ejercicio se marca en el elemento que lo contiene: primero los del foco, si no, el que lo tenga en la matriz.
    const owner = els.find(id => EL[id].topics.includes(EX[x].topic)) || elementsForFleet(fl).find(e => e.topics.includes(EX[x].topic));
    if (!owner) return; const en = entry(typeof owner === 'string' ? owner : owner.id, m, fl, true);
    if (!en.ex.includes(x)) { en.ex.push(x); n++; }
  });
  syncMemoryFromPlanner(fl, m);
  return n;
}
