<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veyra · Acceso interno</title>
<style>
:root{--navy:#07111f;--cream:#f7f1e8;--gold:#d7a63a;--line:#ead7b5;--red:#b42318;--green:#067647}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#07111f,#0b1627);font-family:Arial,Helvetica,sans-serif;color:var(--navy);padding:24px}
.card{width:min(560px,100%);background:#fffdf9;border:1.5px solid var(--gold);border-radius:24px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.brand{font-family:Georgia,'Times New Roman',serif;font-size:52px;line-height:.95}.sub{color:#c89227;letter-spacing:8px;font-size:13px;font-weight:900;margin:8px 0 28px}
h1{font-family:Georgia,'Times New Roman',serif;font-size:34px;margin:0 0 10px}.lead{color:#667085;line-height:1.45;margin-bottom:22px}
label{display:block;font-weight:800;margin:14px 0 7px}input{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;font-size:17px;background:#fff}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button,a{border:1.5px solid var(--gold);border-radius:14px;padding:14px 20px;text-transform:uppercase;letter-spacing:2px;font-weight:900;font-size:13px;text-decoration:none;cursor:pointer}.gold{background:linear-gradient(180deg,#edc65d,#d5a139);color:#07111f}.ghost{background:transparent;color:#07111f}.status{min-height:24px;margin-top:14px;font-weight:800}.bad{color:var(--red)}.ok{color:var(--green)}
</style>
</head>
<body>
<main class="card">
  <div class="brand">Veyra</div>
  <div class="sub">PILOT INTELLIGENCE</div>
  <h1>Acceso interno</h1>
  <p class="lead">Ingresa con una cuenta Veyra autorizada. La sesión se mantiene únicamente durante esta pestaña del navegador.</p>
  <form id="loginForm">
    <label for="email">Correo</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="actions">
      <button id="submitBtn" class="gold" type="submit">Ingresar</button>
      <a class="ghost" href="./">Volver</a>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script src="./internal-admin-auth.js"></script>
<script>
const form=document.getElementById('loginForm');
const statusEl=document.getElementById('status');
const submitBtn=document.getElementById('submitBtn');
const allowed=new Set(['training-dashboard.html','presolo-instructor-dashboard.html','internal-access.html']);
const requested=new URLSearchParams(location.search).get('next');
const next=allowed.has(requested)?requested:'internal-access.html';

VeyraAdminAuth.ensureAdmin().then(ok=>{if(ok) location.replace('./'+next);});
form.addEventListener('submit',async function(event){
  event.preventDefault();
  statusEl.className='status';
  statusEl.textContent='Validando acceso...';
  submitBtn.disabled=true;
  try{
    await VeyraAdminAuth.signIn(document.getElementById('email').value,document.getElementById('password').value);
    statusEl.className='status ok';
    statusEl.textContent='Acceso autorizado.';
    location.replace('./'+next);
  }catch(error){
    statusEl.className='status bad';
    statusEl.textContent=error && error.message ? error.message : 'No fue posible iniciar sesión.';
    document.getElementById('password').value='';
    document.getElementById('password').focus();
  }finally{submitBtn.disabled=false;}
});
</script>
</body>
</html>
